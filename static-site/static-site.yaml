AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Simple static website: a private S3 bucket served through CloudFront (origin
  access control) at DomainName and www.DomainName, with a DNS-validated ACM
  certificate and A/AAAA alias records in an existing Route 53 hosted zone.
  Upload site files to the bucket (see the BucketName output). Must be deployed
  in us-east-1 (CloudFront only accepts ACM certificates from there).

Parameters:
  DomainName:
    Type: String
    Description: Site domain (e.g. example.com). www.DomainName is served too.
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: >
      Route 53 hosted zone ID for DomainName, in this account. Used for ACM DNS
      validation and the alias records pointing at CloudFront.
  ErrorDocument:
    Type: String
    Default: 404.html
    Description: Object key shown for missing pages (served with a 404 status)
  BucketNamePrefix:
    Type: String
    Default: static-site-bucket
    Description: >
      Bucket names are BucketNamePrefix-DomainName-AccountId, with dots in the
      domain replaced by dashes (max 63 characters, so the domain can be about
      30 characters at most). Must match the
      BucketNamePrefix of static-site-permission-set.yaml, which grants access
      to buckets by this prefix.
    AllowedPattern: '^[a-z0-9][a-z0-9-]{0,28}[a-z0-9]$'

Rules:
  MustBeUsEast1:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: Deploy in us-east-1; CloudFront requires its ACM certificate there.

Resources:
  # ------------------------------------------------------------------ Bucket
  # Private: only the CloudFront distribution below can read it.
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub
        - '${BucketNamePrefix}-${DomainDashed}-${AWS::AccountId}'
        - DomainDashed: !Join ['-', !Split ['.', !Ref DomainName]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ------------------------------------------------------------- Certificate
  # DNS validation records are created in HostedZoneId automatically.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub 'www.${DomainName}']
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub 'www.${DomainName}'
          HostedZoneId: !Ref HostedZoneId

  # ------------------------------------------------------------ Distribution
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # S3 only serves index.html at the root; this maps /about/ -> /about/index.html
  # and /about -> /about/index.html for extensionless paths.
  IndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-index'
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub 'Directory index rewrite for ${DomainName}'
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var uri = request.uri;
            if (uri.charAt(uri.length - 1) === '/') {
                request.uri = uri + 'index.html';
            } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
                request.uri = uri + '/index.html';
            }
            return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub 'Static site ${DomainName}'
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: [!Ref DomainName, !Sub 'www.${DomainName}']
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexFunction.FunctionMetadata.FunctionARN
        # The bucket is private, so S3 answers 403 (not 404) for missing keys.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: !Sub '/${ErrorDocument}'
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: !Sub '/${ErrorDocument}'
            ErrorCachingMinTTL: 60

  # --------------------------------------------------------------------- DNS
  # Z2FDTNDATAQYW2 is the fixed hosted zone ID for all CloudFront aliases.
  ApexRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  ApexRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Description: Upload site files here (aws s3 sync ./site s3://<BucketName>)
    Value: !Ref SiteBucket
  DistributionId:
    Description: Use for cache invalidations after uploading
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  CertificateArn:
    Value: !Ref Certificate
  SiteUrl:
    Value: !Sub 'https://${DomainName}'
