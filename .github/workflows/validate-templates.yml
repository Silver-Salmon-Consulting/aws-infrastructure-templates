name: Validate CloudFormation templates

# Validate every CloudFormation template in the repo on each push and PR.
# Uses cfn-lint, which parses the templates and checks resource schemas,
# intrinsic functions, and attribute placement without needing AWS credentials.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail
          # Collect every YAML file that looks like a CloudFormation template
          # (has the AWSTemplateFormatVersion or a Resources section).
          mapfile -t templates < <(grep -rlE '^(AWSTemplateFormatVersion|Resources):' \
            --include='*.yaml' --include='*.yml' . || true)

          if [ ${#templates[@]} -eq 0 ]; then
            echo "No CloudFormation templates found."
            exit 0
          fi

          echo "Linting the following templates:"
          printf '  %s\n' "${templates[@]}"
          cfn-lint "${templates[@]}"

      - name: Check the embedded rotate-git-key matches the repo script
        shell: bash
        run: |
          set -euo pipefail
          pip install pyyaml
          python - <<'PY'
          import sys, yaml

          class Loader(yaml.SafeLoader):
              pass

          Loader.add_multi_constructor("!", lambda loader, suffix, node: None)

          with open("cloud/dev/cloud-dev-environment.yaml") as f:
              template = yaml.load(f, Loader)
          commands = template["Resources"]["AmazonLinuxSourceControlDocument"]["Properties"]["Content"]["mainSteps"][0]["inputs"]["runCommand"]
          block = next(c for c in commands if "ROTATE_EOF" in c)
          embedded = block.split("<<'ROTATE_EOF'\n", 1)[1].rsplit("ROTATE_EOF", 1)[0]
          with open("cloud/dev/scripts/rotate-git-ssh-key.sh") as f:
              repo = f.read()
          if embedded != repo:
              sys.exit("The rotate-git-key copy in the source control document differs from cloud/dev/scripts/rotate-git-ssh-key.sh")
          print("embedded script matches the repo script")
          PY
