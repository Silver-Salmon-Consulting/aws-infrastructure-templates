  # Managed SSM Command Document that installs small, unversioned CLI
  # utilities from the Amazon Linux repos (jq, zip, unzip). These track the
  # distro's packages, so there is no version parameter; tools whose version
  # matters get their own per-major-version documents below.
  AmazonLinuxBaseToolsDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # No SSM parameters and NO ${...} CloudFormation variables.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install jq, zip and unzip from the Amazon Linux repositories.
        mainSteps:
          - action: aws:runShellScript
            name: installBaseTools
            inputs:
              runCommand:
                - set -euxo pipefail
                - dnf install -y jq zip unzip
                - jq --version

  # Versioned tool documents: ONE DOCUMENT PER TOOL PER MAJOR VERSION. The
  # major version is fixed by the document (and its name); the document's
  # version parameter is an exact version within that major, passed by the
  # association from the environment stack (K6V0Version etc.); nothing floats
  # to "latest". A server picks a major
  # with the tool's tag VALUE (e.g. CloudDevK6Config = v0 | v1), so it can
  # only match one major's association at a time. Add a major by copying a
  # document + association and changing the major number.
  #
  # k6 0.x: installs the k6 binary from Grafana's GitHub release tarball
  # (amd64/arm64 picked from uname) into /usr/local/bin/k6, pinned by K6Version.
  AmazonLinuxK6V0Document:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{K6Version}} is an SSM document parameter
      # and must reach the deployed document literally.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install k6 0.x into /usr/local/bin/k6 from Grafana's GitHub release
          tarball. Works on x86_64 and arm64 Amazon Linux.
        parameters:
          K6Version:
            type: String
            description: >-
              Exact k6 0.x version to install (e.g. 0.59.0).
            allowedPattern: ^0\.\d+\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installK6
            inputs:
              runCommand:
                - set -euxo pipefail
                - K6_VERSION="{{K6Version}}"
                - |
                  case "$(uname -m)" in
                    x86_64)  K6_ARCH="amd64" ;;
                    aarch64) K6_ARCH="arm64" ;;
                    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                  esac
                - dnf install -y tar gzip
                - TMP_DIR=$(mktemp -d)
                - curl -sSfL "https://github.com/grafana/k6/releases/download/v$K6_VERSION/k6-v$K6_VERSION-linux-$K6_ARCH.tar.gz" | tar -xz -C "$TMP_DIR"
                - install -m 0755 "$TMP_DIR/k6-v$K6_VERSION-linux-$K6_ARCH/k6" /usr/local/bin/k6
                - rm -rf "$TMP_DIR"
                - /usr/local/bin/k6 version

  # k6 1.x: same script as the 0.x document, with a 1.x version pattern.
  AmazonLinuxK6V1Document:
