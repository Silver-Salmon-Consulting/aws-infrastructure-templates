                - rm -f "$TARBALL"
                - /usr/bin/pwsh --version

  # Managed, versioned SSM Command Document that installs the OS-level shared
  # libraries and fonts Playwright's Chromium needs to run headless on Amazon
  # Linux. `npx playwright install-deps` only supports Debian/Ubuntu (apt), so
  # the equivalent dnf packages are listed here. Browser binaries themselves
  # are installed for the PlaywrightVersion passed by the association, into
  # the shared /opt/playwright-browsers (PLAYWRIGHT_BROWSERS_PATH is exported
  # in /etc/profile.d/playwright.sh), so a project pinned to that version
  # needs no download. Chromium is the supported engine on Amazon Linux;
  # Playwright's WebKit/Firefox builds target Ubuntu. Works on x86_64 and
  # arm64. Amazon Linux specific.
  AmazonLinuxPlaywrightDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{PlaywrightVersion}} is an SSM document
      # parameter and must reach the deployed document literally.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install the system libraries and fonts Playwright's Chromium needs
          to run headless on Amazon Linux (x86_64 and arm64), plus Xvfb for
          headed runs, then the Chromium build for the given Playwright version.
        parameters:
          PlaywrightVersion:
            type: String
            description: Playwright version to install Chromium for (e.g. 1.55.0).
            allowedPattern: ^\d+\.\d+\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installPlaywrightDependencies
            inputs:
              runCommand:
                - set -euxo pipefail
                # Playwright needs Node (installed by the Node config
                # document). That association runs at the same time as this
                # one at first boot, so wait for Node (up to 15 minutes)
                # instead of failing. SSM shells load no profile, so source
                # nvm directly.
                - export HOME=/root
                - |
                  for i in $(seq 1 90); do
                    if [ -s /opt/nvm/nvm.sh ] && ( . /opt/nvm/nvm.sh && command -v node ) >/dev/null 2>&1; then break; fi
                    echo "Waiting for Node.js to be installed ($i/90)..."
                    sleep 10
                  done
                - '. /opt/nvm/nvm.sh && command -v node || { echo "Node.js not found after waiting (check the Node config association)" >&2; exit 1; }'
                # Shared libraries Chromium links against. Installed strictly
                # so a missing package fails the association visibly.
                - >-
                  dnf install -y
                  nss nspr atk at-spi2-atk at-spi2-core cups-libs dbus-libs
                  expat glib2 libdrm libxkbcommon mesa-libgbm alsa-lib
                  pango cairo libX11 libxcb libXcomposite libXcursor
                  libXdamage libXext libXfixes libXi libXrandr libXtst
                  libxshmfence xorg-x11-server-Xvfb
                # Fonts are best-effort (strict=0 skips any package name this
                # AL2023 release does not carry) so text renders in screenshots.
                - >-
                  dnf install -y --setopt=strict=0
                  dejavu-sans-fonts dejavu-serif-fonts dejavu-sans-mono-fonts
                  liberation-fonts google-noto-sans-fonts
                  google-noto-emoji-color-fonts
                - fc-cache -f || true
                # Chromium for the requested Playwright version, shared by
                # every user via PLAYWRIGHT_BROWSERS_PATH.
                - export PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers
                - mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
                - npx --yes "playwright@{{PlaywrightVersion}}" install chromium
                - chmod -R a+rX "$PLAYWRIGHT_BROWSERS_PATH"
                - printf 'export PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers\n' > /etc/profile.d/playwright.sh
                - chmod +x /etc/profile.d/playwright.sh

  # Versioned SSM Command Documents that install a .NET SDK (build, run, test)
  # under /opt/dotnet using Microsoft's dotnet-install.sh, which picks the
  # right x64/arm64 build automatically. ONE DOCUMENT PER MAJOR VERSION (8,
  # 10); the exact SDK version comes from the environment stack's
  # DotNet<major>Version parameter, passed by the association (the documents
  # themselves have no default). A
  # server picks a major with the CloudDevDotNetConfig tag VALUE.
  # Amazon Linux specific (dnf for the native deps).
  AmazonLinuxDotNet8SdkDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{DotNetVersion}} is an SSM document
      # parameter and must reach the deployed document literally. There are
      # intentionally NO ${...} CloudFormation variables in this script.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install the .NET 8 SDK into /opt/dotnet, symlink /usr/bin/dotnet
          and expose DOTNET_ROOT through /etc/profile.d/dotnet.sh. Works on
          x86_64 and arm64 Amazon Linux.
        parameters:
          DotNetVersion:
            type: String
            description: >-
              Exact .NET 8 SDK version to install (e.g. 8.0.426).
            allowedPattern: ^8\.0\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installDotNetSdk
            inputs:
              runCommand:
                - set -euxo pipefail
                # dotnet-install.sh resolves paths from HOME; SSM leaves it unset.
                - export HOME=/root
                - dnf install -y tar gzip libicu krb5-libs openssl-libs zlib libstdc++
                - INSTALL_DIR=/opt/dotnet
                - mkdir -p "$INSTALL_DIR"
                - curl -sSfL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
                - bash /tmp/dotnet-install.sh --version "{{DotNetVersion}}" --install-dir "$INSTALL_DIR" --no-path
                - ln -sf "$INSTALL_DIR/dotnet" /usr/bin/dotnet
                - printf 'export DOTNET_ROOT=/opt/dotnet\nexport DOTNET_CLI_TELEMETRY_OPTOUT=1\nexport PATH="$PATH:$HOME/.dotnet/tools"\n' > /etc/profile.d/dotnet.sh
                - chmod +x /etc/profile.d/dotnet.sh
                - /usr/bin/dotnet --list-sdks

  AmazonLinuxDotNet10SdkDocument:
    Type: AWS::SSM::Document
