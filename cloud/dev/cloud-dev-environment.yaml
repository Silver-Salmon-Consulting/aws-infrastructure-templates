                - set -euxo pipefail
                - K6_VERSION="{{K6Version}}"
                - |
                  case "$(uname -m)" in
                    x86_64)  K6_ARCH="amd64" ;;
                    aarch64) K6_ARCH="arm64" ;;
                    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                  esac
                - dnf install -y tar gzip
                - TMP_DIR=$(mktemp -d)
                - curl -sSfL "https://github.com/grafana/k6/releases/download/v$K6_VERSION/k6-v$K6_VERSION-linux-$K6_ARCH.tar.gz" | tar -xz -C "$TMP_DIR"
                - install -m 0755 "$TMP_DIR/k6-v$K6_VERSION-linux-$K6_ARCH/k6" /usr/local/bin/k6
                - rm -rf "$TMP_DIR"
                - /usr/local/bin/k6 version

  # AWS CLI 2.x from AWS's official installer into /usr/local/aws-cli, with
  # /usr/local/bin/aws. AL2023 also ships an (older, distro-paced) awscli-2
  # RPM at /usr/bin/aws; it is left in place because UserData uses it to
  # signal CloudFormation, and /usr/local/bin comes first on login shells'
  # PATH. (sudo's secure_path omits /usr/local/bin, so `sudo aws` still runs
  # the RPM build.) --update makes re-runs upgrade or re-pin in place.
  AmazonLinuxAwsCliV2Document:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{AwsCliVersion}} is an SSM document
      # parameter and must reach the deployed document literally.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install AWS CLI v2 with AWS's official installer into
          /usr/local/aws-cli and /usr/local/bin/aws. Works on x86_64 and arm64
          Amazon Linux.
        parameters:
          AwsCliVersion:
            type: String
            description: >-
              Exact AWS CLI 2.x version to install (e.g. 2.38.5).
            allowedPattern: ^2\.\d+\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installAwsCli
            inputs:
              runCommand:
                - set -euxo pipefail
                - AWSCLI_VERSION="{{AwsCliVersion}}"
                - |
                  case "$(uname -m)" in
                    x86_64|aarch64) AWSCLI_ARCH="$(uname -m)" ;;
                    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                  esac
                - dnf install -y unzip
                - ZIP_NAME="awscli-exe-linux-$AWSCLI_ARCH-$AWSCLI_VERSION.zip"
                - TMP_DIR=$(mktemp -d)
                - curl -sSfL "https://awscli.amazonaws.com/$ZIP_NAME" -o "$TMP_DIR/awscliv2.zip"
                - unzip -q "$TMP_DIR/awscliv2.zip" -d "$TMP_DIR"
                - '"$TMP_DIR/aws/install" --install-dir /usr/local/aws-cli --bin-dir /usr/local/bin --update'
                - rm -rf "$TMP_DIR"
                - /usr/local/bin/aws --version
                # Start ec2-user with an empty ~/.aws/credentials so it is
                # ready to fill in. Never overwrite an existing file, so
                # re-runs keep any credentials already added. With no profile
                # defined in it, the CLI still uses the instance role.
                - mkdir -p /home/ec2-user/.aws
                - touch /home/ec2-user/.aws/credentials
                - chown -R ec2-user:ec2-user /home/ec2-user/.aws
                - chmod 700 /home/ec2-user/.aws
                - chmod 600 /home/ec2-user/.aws/credentials

  # GitHub CLI 2.x from GitHub's release tarball (amd64/arm64 picked from
  # uname) into /usr/local/bin/gh, pinned by GhCliVersion. Applied to servers
  # with SourceProvider=GitHub. git itself comes from dnf with the Node config
  # document; the SSH key, rotate-git-key and the code directory come from the
  # source control document below.
  AmazonLinuxGhCliV2Document:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{GhCliVersion}} is an SSM document
      # parameter and must reach the deployed document literally. (Its
      # default is a plain !Ref, which leaves it alone.)
      Content:
        schemaVersion: "2.2"
        description: >-
          Install the GitHub CLI 2.x into /usr/local/bin/gh. Works on x86_64
          and arm64 Amazon Linux.
        parameters:
          GhCliVersion:
            type: String
            description: >-
              Exact GitHub CLI 2.x version to install (e.g. 2.103.0). Defaults
              to the stack's GhCliV2Version, so a manual run needs no input.
            default: !Ref GhCliV2Version
            allowedPattern: ^2\.\d+\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installGhCli
            inputs:
              runCommand:
                - set -euxo pipefail
                - GH_VERSION="{{GhCliVersion}}"
                - |
                  case "$(uname -m)" in
                    x86_64)  GH_ARCH="amd64" ;;
                    aarch64) GH_ARCH="arm64" ;;
                    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                  esac
                - dnf install -y tar gzip
                - TMP_DIR=$(mktemp -d)
                - curl -sSfL "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_${GH_ARCH}.tar.gz" | tar -xz -C "$TMP_DIR"
                - install -m 0755 "$TMP_DIR/gh_${GH_VERSION}_linux_${GH_ARCH}/bin/gh" /usr/local/bin/gh
                - rm -rf "$TMP_DIR"
                - /usr/local/bin/gh --version

  # Azure CLI 2.x plus its azure-devops extension (az repos / az pipelines /
  # az boards), the Azure DevOps counterpart of gh. Applied to servers with
  # SourceProvider=AzureDevOps. Installs Microsoft's RHEL 9 RPM (x86_64 or
  # aarch64) straight from packages.microsoft.com, pinned by AzCliVersion and
  # signature-checked against Microsoft's key; dnf pulls its python3.12
  # dependency from the AL2023 repos. No repo is added, so a dnf upgrade never
  # moves it off the pin. The extension is installed for ec2-user, the user
  # who signs in with `az devops login` (a PAT) or `az login`.
  AmazonLinuxAzCliV2Document:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{AzCliVersion}} is an SSM document
      # parameter and must reach the deployed document literally. (Its
      # default is a plain !Ref, which leaves it alone.)
      Content:
        schemaVersion: "2.2"
        description: >-
          Install the Azure CLI 2.x (/usr/bin/az) and the azure-devops
          extension for ec2-user. Works on x86_64 and arm64 Amazon Linux.
        parameters:
          AzCliVersion:
            type: String
            description: >-
              Exact Azure CLI 2.x version to install (e.g. 2.91.0). Defaults to
              the stack's AzCliV2Version, so a manual run needs no input.
            default: !Ref AzCliV2Version
            allowedPattern: ^2\.\d+\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installAzCli
            inputs:
              runCommand:
                - set -euxo pipefail
                - AZ_VERSION="{{AzCliVersion}}"
                - |
                  case "$(uname -m)" in
                    x86_64|aarch64) AZ_ARCH="$(uname -m)" ;;
                    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                  esac
                - rpm --import https://packages.microsoft.com/keys/microsoft.asc
                - AZ_RPM="https://packages.microsoft.com/rhel/9.0/prod/Packages/a/azure-cli-$AZ_VERSION-1.el9.$AZ_ARCH.rpm"
                # install covers a first install and an upgrade; downgrade
                # covers pinning an older release.
                - dnf install -y --setopt=localpkg_gpgcheck=1 "$AZ_RPM" || dnf downgrade -y --setopt=localpkg_gpgcheck=1 "$AZ_RPM"
                - sudo -u ec2-user -H az config set core.collect_telemetry=false --only-show-errors
                - sudo -u ec2-user -H az extension add --name azure-devops --upgrade --yes --only-show-errors
                - sudo -u ec2-user -H az version

  # Source control document: provider-neutral Git setup for dev servers,
  # selected by the Action parameter (one script that branches on it).
  # Provider is the server's SourceProvider (its CloudDevSourceProvider tag)
  # unless set explicitly.
  #  - Setup (default): installs the rotate-git-key helper into
  #    /usr/local/bin (rotate-github-key is kept as a link to it), creates
  #    the code directory for ec2-user and sets ec2-user's git user.name /
  #    user.email from the CloudDevGitUserName / CloudDevGitUserEmail tags
  #    when present. This is what the association runs.
  #  - RotateSshKey: on-demand, run it from Run Command, the CLI or
  #    rotate-git-key; the association never runs it. Generates a new key for
  #    ec2-user in ~/.ssh/<provider>/ (the private key never leaves the
  #    instance): ed25519 for GitHub, 4096-bit ssh-rsa for Azure DevOps, which
  #    accepts only RSA. Points that provider's managed ~/.ssh/config block at
  #    it, keeps only the newest KeepKeys keys for that provider and prints the
  #    new public key plus the fingerprints of the keys it removed. Adding the
  #    new key in GitHub / Azure DevOps and deleting the old ones there is
  #    manual: the server holds no credentials for either.
  AmazonLinuxSourceControlDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{...}} tokens are SSM document parameters
      # and must reach the deployed document literally.
      Content:
        schemaVersion: "2.2"
        description: >-
          Git source control on Amazon Linux dev servers (GitHub or Azure
          DevOps). Action=Setup installs the rotate-git-key helper, creates
          the code directory for ec2-user and sets its git user.name /
          user.email from the server's tags; Action=RotateSshKey generates a new
          SSH key for ec2-user (ed25519 for GitHub, ssh-rsa for Azure DevOps)
          and prints the public key to add.
        parameters:
          Action:
            type: String
            description: Set up the server, or rotate the SSH key.
            default: Setup
            allowedValues:
              - Setup
              - RotateSshKey
          Provider:
            type: String
            description: >-
              auto (default) uses the server's SourceProvider tag. Set GitHub
              or AzureDevOps to rotate that provider's key instead, e.g. on a
              server that uses both.
            default: auto
            allowedValues:
              - auto
              - GitHub
              - AzureDevOps
          KeepKeys:
            type: String
            description: >-
              RotateSshKey only: how many of this provider's keys to keep on
              the instance, including the new one (2 = the new key plus the
              previous one, for rollback).
            default: "2"
            allowedPattern: ^[1-9]$
          CodeDirectory:
            type: String
            description: >-
              Setup only: directory created for ec2-user to clone code into.
              Empty (default) = /home/ec2-user/github for GitHub,
              /home/ec2-user/azuredevops for Azure DevOps. Existing contents
              are never touched.
            default: ""
            allowedPattern: ^(/home/ec2-user/[A-Za-z0-9._/-]+)?$
        mainSteps:
          - action: aws:runShellScript
            name: sourceControl
            inputs:
              # One script that branches on Action. (Document-level
              # preconditions were not used: they cannot reliably gate steps
              # on a document parameter.)
              runCommand:
                - |
                  set -euo pipefail
                  ACTION="{{Action}}"
                  case "$ACTION" in
                    Setup|RotateSshKey) ;;
                    *) echo "Unknown Action: $ACTION" >&2; exit 1 ;;
                  esac

                  # The server's tags: the provider (auto) and the key title.
                  TOKEN=$(curl -sS -X PUT -H "X-aws-ec2-metadata-token-ttl-seconds:60" http://169.254.169.254/latest/api/token)
                  INSTANCE_ID=$(curl -sS -H "X-aws-ec2-metadata-token:$TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
                  REGION=$(curl -sS -H "X-aws-ec2-metadata-token:$TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
                  TAGS=$(aws ec2 describe-tags --region "$REGION" --filters "Name=resource-id,Values=$INSTANCE_ID" --query 'Tags[].[Key,Value]' --output text 2>/dev/null || true)
                  tag() { printf '%s\n' "$TAGS" | awk -F'\t' -v k="$1" '$1==k{print $2}'; }

                  PROVIDER="{{Provider}}"
                  if [ "$PROVIDER" = "auto" ]; then
                    PROVIDER=$(tag CloudDevSourceProvider)
                    case "$PROVIDER" in
                      GitHub|AzureDevOps) ;;
                      *) echo "This server's CloudDevSourceProvider tag is '${PROVIDER:-unset}'; set SourceProvider on its stack or pass Provider=GitHub|AzureDevOps." >&2; exit 1 ;;
                    esac
                  fi
                  case "$PROVIDER" in
                    GitHub)
                      SLUG=github KEY_TYPE=ed25519 KEYGEN_ARGS=(-t ed25519)
                      SSH_HOSTS="github.com" CHECK="ssh -T git@github.com"
                      ADD_AT="GitHub > Settings > SSH and GPG keys > New SSH key (or as a deploy key on one repo)"
                      ;;
                    AzureDevOps)
                      # vs-ssh.visualstudio.com serves older *.visualstudio.com org URLs.
                      SLUG=azuredevops KEY_TYPE=rsa KEYGEN_ARGS=(-t rsa -b 4096)
                      SSH_HOSTS="ssh.dev.azure.com vs-ssh.visualstudio.com" CHECK="ssh -T git@ssh.dev.azure.com"
                      ADD_AT="Azure DevOps > User settings > SSH public keys > New Key"
                      ;;
                  esac

                  if [ "$ACTION" = "RotateSshKey" ]; then
                    KEEP="{{KeepKeys}}"
                    USER_NAME=ec2-user
                    SSH_DIR="/home/$USER_NAME/.ssh"
                    KEY_DIR="$SSH_DIR/$SLUG"
                    mkdir -p "$KEY_DIR"
                    chmod 700 "$SSH_DIR" "$KEY_DIR"
                    STAMP=$(date -u +%Y%m%dT%H%M%SZ)
                    # Name the key after the server, not the instance ID: the DnsName tag if
                    # set, else the CloudFormation stack name, else the instance ID.
                    NAME=$(tag DnsName)
                    [ -n "$NAME" ] || NAME=$(tag aws:cloudformation:stack-name)
                    [ -n "$NAME" ] || NAME="$INSTANCE_ID"
                    NAME=$(printf '%s' "$NAME" | tr -c 'A-Za-z0-9._-' '-')
                    TITLE="$NAME-$STAMP"
                    NEW_KEY="$KEY_DIR/id_${KEY_TYPE}_$STAMP"
                    ssh-keygen -q "${KEYGEN_ARGS[@]}" -N "" -C "$TITLE" -f "$NEW_KEY"
                    # This provider's managed block goes at the top of ~/.ssh/config (ssh
                    # uses the first value it finds); the rest of the file is kept.
                    touch "$SSH_DIR/config"
                    sed -i "/^# BEGIN clouddev-$SLUG\$/,/^# END clouddev-$SLUG\$/d" "$SSH_DIR/config"
                    CONFIG_TMP=$(mktemp)
                    printf '# BEGIN clouddev-%s\nHost %s\n  User git\n  IdentityFile %s\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n# END clouddev-%s\n' "$SLUG" "$SSH_HOSTS" "$NEW_KEY" "$SLUG" > "$CONFIG_TMP"
                    cat "$SSH_DIR/config" >> "$CONFIG_TMP"
                    cat "$CONFIG_TMP" > "$SSH_DIR/config"
                    rm -f "$CONFIG_TMP"
                    chmod 600 "$SSH_DIR/config"
                    REMOVED=""
                    # Keep the newest keys: sort on the timestamp after the last "_"
                    # (id_<type>_<stamp>), not on the whole name.
                    for OLD in $(ls -1 "$KEY_DIR"/id_* 2>/dev/null | grep -v '\.pub$' | awk -F_ '{print $NF "\t" $0}' | sort -r | cut -f2 | tail -n +$((KEEP + 1))); do
                      REMOVED="$REMOVED$(ssh-keygen -lf "$OLD.pub")"$'\n'
                      rm -f "$OLD" "$OLD.pub"
                    done
                    chown -R "$USER_NAME:$USER_NAME" "$SSH_DIR"
                    echo "=== New $PROVIDER SSH key ($KEY_TYPE) ==="
                    echo "Title: $TITLE"
                    ssh-keygen -lf "$NEW_KEY.pub"
                    echo "Public key (add in $ADD_AT):"
                    cat "$NEW_KEY.pub"
                    echo "=== Removed from this instance (delete the matching keys in $PROVIDER) ==="
                    if [ -n "$REMOVED" ]; then printf "%s" "$REMOVED"; else echo "(none)"; fi
                    echo "After adding the key, verify with: sudo -u ec2-user $CHECK"
                    exit 0
                  fi

                  # Action=Setup: the rotate-git-key helper, then the code directory.
                  # This is a copy of cloud/dev/scripts/rotate-git-ssh-key.sh: keep the two
                  # in sync (the repo file is the source of truth; CI checks they match).
                  cat > /usr/local/bin/rotate-git-key <<'ROTATE_EOF'
                  #!/bin/bash
                  # Rotate the Git SSH key on a CloudDev dev server by running the environment
                  # stack's source control SSM document with Action=RotateSshKey, then print the
                  # new public key to add in GitHub or Azure DevOps.
                  #
                  # Usage: rotate-git-key [-P github|azuredevops] [-i instance-id] [-k keep]
                  #                       [-r region] [-p aws-profile] [-d document-name]
                  #
                  # Defaults: the server's own source provider (its SourceProvider choice; GitHub
                  # gets an ed25519 key, Azure DevOps a 4096-bit ssh-rsa key), the instance this
                  # script runs on (from instance metadata), keep 2 keys, the region from instance
                  # metadata or AWS_REGION, and the document found by name. -P rotates the other
                  # provider's key instead, for a server that uses both. Run it anywhere your AWS
                  # credentials allow ssm:SendCommand on the document and the instance: the
                  # CloudDev permission set does, and so does the shared dev server role (for
                  # servers of its own environment), so on a server no profile is needed.
                  set -euo pipefail

                  INSTANCE="" KEEP=2 PROVIDER=auto REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}" DOC="${DOC:-}" PROFILE_ARGS=()

                  usage() { sed -n '2,16p' "$0" | sed 's/^# \{0,1\}//'; exit "${1:-0}"; }

                  while getopts "P:i:k:r:p:d:h" opt; do
                    case "$opt" in
                      P) PROVIDER="$OPTARG" ;;
                      i) INSTANCE="$OPTARG" ;;
                      k) KEEP="$OPTARG" ;;
                      r) REGION="$OPTARG" ;;
                      p) PROFILE_ARGS=(--profile "$OPTARG") ;;
                      d) DOC="$OPTARG" ;;
                      h) usage 0 ;;
                      *) usage 1 ;;
                    esac
                  done

                  case "$(printf '%s' "$PROVIDER" | tr '[:upper:]' '[:lower:]')" in
                    auto) PROVIDER=auto ;;
                    github) PROVIDER=GitHub ;;
                    azuredevops|azure|ado) PROVIDER=AzureDevOps ;;
                    *) echo "Unknown provider: $PROVIDER (use github or azuredevops)." >&2; exit 1 ;;
                  esac

                  imds() {
                    local token
                    token=$(curl -sS -m 2 -X PUT http://169.254.169.254/latest/api/token \
                      -H "X-aws-ec2-metadata-token-ttl-seconds: 60") || return 1
                    curl -sS -m 2 -H "X-aws-ec2-metadata-token: $token" "http://169.254.169.254/latest/meta-data/$1"
                  }

                  if [ -z "$INSTANCE" ]; then
                    INSTANCE=$(imds instance-id) || { echo "Not on an EC2 instance; pass -i <instance-id>." >&2; exit 1; }
                  fi
                  if [ -z "$REGION" ]; then
                    REGION=$(imds placement/region) || { echo "Could not determine the region; pass -r <region>." >&2; exit 1; }
                  fi

                  aws_() { aws "${PROFILE_ARGS[@]}" --region "$REGION" "$@"; }

                  if [ -z "$DOC" ]; then
                    # list-documents is paginated and --query runs per page, so pages with no
                    # match print "None"; keep only the first real name.
                    DOC=$(aws_ ssm list-documents --filters Key=Owner,Values=Self \
                      --query "DocumentIdentifiers[?contains(Name,'AmazonLinuxSourceControlDocument')].Name" --output text \
                      | tr '\t' '\n' | grep -v -E '^(None)?$' | head -n 1 || true)
                    if [ -z "$DOC" ]; then
                      echo "Could not find the source control SSM document; pass -d <document-name>." >&2
                      exit 1
                    fi
                  fi

                  echo "Rotating the $PROVIDER SSH key on $INSTANCE ($REGION) with $DOC (keep $KEEP)..."
                  CMD=$(aws_ ssm send-command --document-name "$DOC" --instance-ids "$INSTANCE" \
                    --parameters "Action=RotateSshKey,Provider=$PROVIDER,KeepKeys=$KEEP" \
                    --query Command.CommandId --output text)

                  # 'wait' exits non-zero if the command fails; still show the output then.
                  STATUS=0
                  aws_ ssm wait command-executed --command-id "$CMD" --instance-id "$INSTANCE" || STATUS=$?

                  aws_ ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
                    --query StandardOutputContent --output text
                  if [ "$STATUS" -ne 0 ]; then
                    echo "--- the command did not succeed; error output:" >&2
                    aws_ ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
                      --query StandardErrorContent --output text >&2
                    exit "$STATUS"
                  fi

                  cat <<'EOF'

                  Next: add the public key above where the output says, delete the keys listed
                  under "Removed", then run the check command it printed.
                  EOF
                  ROTATE_EOF
                  chmod 0755 /usr/local/bin/rotate-git-key
                  # The old name, used before Azure DevOps support.
                  ln -sfn rotate-git-key /usr/local/bin/rotate-github-key
                  /usr/local/bin/rotate-git-key -h > /dev/null

                  # A directory ready for code, owned by ec2-user. Safe to re-run:
                  # mkdir -p and chown on the directory itself only.
                  CODE_DIR="{{CodeDirectory}}"
                  [ -n "$CODE_DIR" ] || CODE_DIR="/home/ec2-user/$SLUG"
                  mkdir -p "$CODE_DIR"
                  chown ec2-user:ec2-user "$CODE_DIR"
                  chmod 0755 "$CODE_DIR"

                  # Git identity for ec2-user from the server stack's GitUserName /
                  # GitUserEmail (the CloudDevGitUserName / CloudDevGitUserEmail tags).
                  # An absent tag leaves that setting alone. git normally comes with
                  # the Node document, which may not have run yet.
                  GIT_NAME=$(tag CloudDevGitUserName)
                  GIT_EMAIL=$(tag CloudDevGitUserEmail)
                  if [ -n "$GIT_NAME$GIT_EMAIL" ]; then
                    command -v git > /dev/null || dnf install -y git
                    [ -z "$GIT_NAME" ] || sudo -u ec2-user -H git config --global user.name "$GIT_NAME"
                    [ -z "$GIT_EMAIL" ] || sudo -u ec2-user -H git config --global user.email "$GIT_EMAIL"
                  fi

  # Automation runbooks that let developers start, stop and restart a dev
  # server from Systems Manager > Automation > Execute. No AssumeRole is set,
  # so they run with the caller's own permissions: the CloudDev permission
  # set only allows EC2 start/stop/reboot on instances tagged with this
  # environment, so these cannot touch anything else.
  StartDevServerRunbook:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Automation
      DocumentFormat: YAML
      # No Fn::Sub: {{InstanceId}} is an Automation parameter and must reach
      # the deployed document literally.
      Content:
        schemaVersion: "0.3"
        description: >-
          Start a stopped CloudDev dev server and wait until it is running.
        parameters:
          InstanceId:
            type: String
            description: Dev server instance to act on.
            allowedPattern: ^i-[0-9a-f]{8,17}$
        mainSteps:
          - name: changeState
            action: aws:changeInstanceState
            inputs:
              InstanceIds:
                - "{{InstanceId}}"
              DesiredState: running

  # Stops a dev server (EBS data is kept; compute billing pauses).
  StopDevServerRunbook:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Automation
      DocumentFormat: YAML
      # No Fn::Sub: {{InstanceId}} is an Automation parameter and must reach
      # the deployed document literally.
      Content:
        schemaVersion: "0.3"
        description: >-
          Stop a running CloudDev dev server and wait until it is stopped.
        parameters:
          InstanceId:
            type: String
            description: Dev server instance to act on.
            allowedPattern: ^i-[0-9a-f]{8,17}$
        mainSteps:
          - name: changeState
            action: aws:changeInstanceState
            inputs:
              InstanceIds:
                - "{{InstanceId}}"
              DesiredState: stopped

  # Reboots a dev server in place (same host, same public IP if any).
  RestartDevServerRunbook:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Automation
      DocumentFormat: YAML
      # No Fn::Sub: {{InstanceId}} is an Automation parameter and must reach
      # the deployed document literally.
      Content:
        schemaVersion: "0.3"
        description: >-
          Reboot a CloudDev dev server in place.
        parameters:
          InstanceId:
            type: String
            description: Dev server instance to act on.
            allowedPattern: ^i-[0-9a-f]{8,17}$
        mainSteps:
          - name: reboot
            action: aws:executeAwsApi
            inputs:
              Service: ec2
              Api: RebootInstances
              InstanceIds:
                - "{{InstanceId}}"


  # Tag-targeted SSM State Manager association that applies the Node config
  # document to every dev server tagged CloudDevNodeConfig=enabled. Lives in
  # this stack beside the document and references it with !Ref (NO
  # Fn::ImportValue), so editing the document no longer hits a cross-stack
  # export lock. No Parameters: the document's own NodeVersion/NpmVersion
  # defaults (fleet-wide, from this stack's params) govern. Launch-only
  # (no ScheduleExpression); applies when a matching instance registers with
  # SSM. Decouple a server by removing its CloudDevNodeConfig tag.
  NodeConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-node-config"
      Name: !Ref AmazonLinuxServerConfigDocument
      Targets:
        - Key: "tag:CloudDevNodeConfig"
          Values:
            - enabled

  # Per-major-version associations for PowerShell and .NET (same pattern as
  # k6 below): each tool has ONE tag key and the tag VALUE selects the
  # document, so a server matches at most one association per tool. Each
  # passes its exact version from the matching environment stack parameter
  # (the documents have no defaults). Launch-only; a server opts out with a
  # value that matches nothing ("none").
  PowerShellV74ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-powershell-v74"
      Name: !Ref AmazonLinuxPowerShellV74Document
      Parameters:
        PowerShellVersion:
          - !Ref PowerShell74Version
      Targets:
        - Key: "tag:CloudDevPowerShellConfig"
          Values:
            - v7.4

  PowerShellV76ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-powershell-v76"
      Name: !Ref AmazonLinuxPowerShellV76Document
      Parameters:
        PowerShellVersion:
          - !Ref PowerShell76Version
      Targets:
        - Key: "tag:CloudDevPowerShellConfig"
          Values:
            - v7.6

  # Tag-targeted association that applies the Playwright document to every
  # dev server tagged CloudDevPlaywrightConfig=enabled, passing the
  # environment stack's PlaywrightVersion (the server stacks use "disabled"
  # when EnablePlaywright=false).
  PlaywrightConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-playwright"
      Name: !Ref AmazonLinuxPlaywrightDocument
      Parameters:
        PlaywrightVersion:
          - !Ref PlaywrightVersion
      Targets:
        - Key: "tag:CloudDevPlaywrightConfig"
          Values:
            - enabled

  DotNet8ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-dotnet8"
      Name: !Ref AmazonLinuxDotNet8SdkDocument
      Parameters:
        DotNetVersion:
          - !Ref DotNet8Version
      Targets:
        - Key: "tag:CloudDevDotNetConfig"
          Values:
            - v8

  DotNet10ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-dotnet10"
      Name: !Ref AmazonLinuxDotNet10SdkDocument
      Parameters:
        DotNetVersion:
          - !Ref DotNet10Version
      Targets:
        - Key: "tag:CloudDevDotNetConfig"
          Values:
            - v10

  # Tag-targeted association that applies the base tools document. Every dev
  # server tags itself CloudDevBaseToolsConfig=enabled, like Node.
  BaseToolsConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-base-tools"
      Name: !Ref AmazonLinuxBaseToolsDocument
      Targets:
        - Key: "tag:CloudDevBaseToolsConfig"
          Values:
            - enabled

  # Per-major-version associations. All k6 majors share one tag key and
  # differ by tag VALUE, so a server matches at most one of them; switching
  # the value and re-applying replaces /usr/local/bin/k6. Each passes its
  # pinned version from the matching environment stack parameter.
  K6V0ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-k6-v0"
      Name: !Ref AmazonLinuxK6V0Document
      Parameters:
        K6Version:
          - !Ref K6V0Version
      Targets:
        - Key: "tag:CloudDevK6Config"
          Values:
            - v0

  K6V1ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-k6-v1"
      Name: !Ref AmazonLinuxK6V1Document
      Parameters:
        K6Version:
          - !Ref K6V1Version
      Targets:
        - Key: "tag:CloudDevK6Config"
          Values:
            - v1

  AwsCliV2ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-awscli-v2"
      Name: !Ref AmazonLinuxAwsCliV2Document
      Parameters:
        AwsCliVersion:
          - !Ref AwsCliV2Version
      Targets:
        - Key: "tag:CloudDevAwsCliConfig"
          Values:
            - v2

  GhCliV2ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-ghcli-v2"
      Name: !Ref AmazonLinuxGhCliV2Document
      Parameters:
        GhCliVersion:
          - !Ref GhCliV2Version
      Targets:
        - Key: "tag:CloudDevGhCliConfig"
          Values:
            - v2

  AzCliV2ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-azcli-v2"
      Name: !Ref AmazonLinuxAzCliV2Document
      Parameters:
        AzCliVersion:
          - !Ref AzCliV2Version
      Targets:
        - Key: "tag:CloudDevAzCliConfig"
          Values:
            - v2

  # rotate-git-key and the code directory on every server with a source
  # provider. The SSH key itself is rotated on demand, never by this.
  SourceControlConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-source-control"
      Name: !Ref AmazonLinuxSourceControlDocument
      Parameters:
        Action:
          - Setup
      Targets:
        - Key: "tag:CloudDevSourceProvider"
          Values:
            - GitHub
            - AzureDevOps

  # ---- VPC + public networking (created when VpcMode != none) ----
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateVpc
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVpc
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: !Ref "AWS::Region"
      CidrBlock: !Select [0, !Cidr [!GetAtt Vpc.CidrBlock, 8, 12]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: PublicAz2
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: !Ref "AWS::Region"
      CidrBlock: !Select [1, !Cidr [!GetAtt Vpc.CidrBlock, 8, 12]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-2"

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Condition: PublicAz3
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone:
        Fn::Select:
          - 2
          - Fn::GetAZs: !Ref "AWS::Region"
      CidrBlock: !Select [2, !Cidr [!GetAtt Vpc.CidrBlock, 8, 12]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-3"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpc
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: PublicAz2
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: PublicAz3
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

  DevServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateVpc
    Properties:
      GroupDescription: !Sub "SSH access for ${AWS::StackName} dev servers, restricted to a single CIDR."
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCidr
          Description: SSH from the configured allowed CIDR.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic.
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sg"

  # ---- Private networking + NAT (created when VpcMode == public-private) ----
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreatePrivate
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: !Ref "AWS::Region"
      CidrBlock: !Select [3, !Cidr [!GetAtt Vpc.CidrBlock, 8, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: PrivateAz2
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: !Ref "AWS::Region"
      CidrBlock: !Select [4, !Cidr [!GetAtt Vpc.CidrBlock, 8, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-2"

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Condition: PrivateAz3
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone:
        Fn::Select:
          - 2
          - Fn::GetAZs: !Ref "AWS::Region"
      CidrBlock: !Select [5, !Cidr [!GetAtt Vpc.CidrBlock, 8, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-3"

  NatEip:
    Type: AWS::EC2::EIP
    Condition: CreatePrivate
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-eip"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreatePrivate
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreatePrivate
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreatePrivate
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePrivate
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: PrivateAz2
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: PrivateAz3
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  StartDevServerRunbookName:
    Description: Name of the Automation runbook that starts a dev server.
    Value: !Ref StartDevServerRunbook

  StopDevServerRunbookName:
    Description: Name of the Automation runbook that stops a dev server.
    Value: !Ref StopDevServerRunbook

  RestartDevServerRunbookName:
    Description: Name of the Automation runbook that reboots a dev server.
    Value: !Ref RestartDevServerRunbook
  DevServerRoleArn:
    Description: ARN of the shared SSM-managed IAM role.
    Value: !GetAtt DevServerRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DevServerRoleArn"

  DevServerRoleName:
    Description: Name of the shared SSM-managed IAM role.
    Value: !Ref DevServerRole
    Export:
      Name: !Sub "${AWS::StackName}-DevServerRoleName"

  DevServerInstanceProfileArn:
    Description: ARN of the shared instance profile.
    Value: !GetAtt DevServerInstanceProfile.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DevServerInstanceProfileArn"

  DevServerInstanceProfileName:
    Description: Name of the shared instance profile.
    Value: !Ref DevServerInstanceProfile
    Export:
      Name: !Sub "${AWS::StackName}-DevServerInstanceProfileName"

  BootstrapLogGroupName:
    Description: Name of the shared bootstrap CloudWatch log group.
    Value: !Ref BootstrapLogGroup
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapLogGroupName"

  StackNamePrefixOutput:
    Description: >-
      Stack-name prefix the dev server role may signal. Server stacks import
      it to check their own name at boot and log a clear error if it does not
      match.
    Value: !Ref StackNamePrefix
    Export:
      Name: !Sub "${AWS::StackName}-StackNamePrefix"

  BootstrapLogGroupArn:
    Description: ARN of the shared bootstrap CloudWatch log group.
    Value: !GetAtt BootstrapLogGroup.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapLogGroupArn"

  AmazonLinuxServerConfigDocumentName:
    Description: >-
      Name of the shared SSM Command Document that configures Amazon Linux dev
      servers (installs Node.js/npm via nvm). Amazon Linux specific (uses dnf
      and the ec2-user account).
    Value: !Ref AmazonLinuxServerConfigDocument
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxServerConfigDocumentName"

  AmazonLinuxPowerShellV74DocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs PowerShell 7.4.x
      (PowerShellVersion parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxPowerShellV74Document
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxPowerShellV74DocumentName"

  AmazonLinuxPowerShellV76DocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs PowerShell 7.6.x
      (PowerShellVersion parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxPowerShellV76Document
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxPowerShellV76DocumentName"

  AmazonLinuxPlaywrightDocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs Playwright's
      Chromium system dependencies and the Chromium build for the
      PlaywrightVersion parameter on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxPlaywrightDocument
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxPlaywrightDocumentName"

  AmazonLinuxDotNet8SdkDocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs the .NET 8 SDK
      (DotNetVersion parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxDotNet8SdkDocument
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxDotNet8SdkDocumentName"

  AmazonLinuxDotNet10SdkDocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs the .NET 10 SDK
      (DotNetVersion parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxDotNet10SdkDocument
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxDotNet10SdkDocumentName"

  AmazonLinuxBaseToolsDocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs jq, zip and unzip
      on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxBaseToolsDocument
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxBaseToolsDocumentName"

  AmazonLinuxK6V0DocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs k6 0.x
      (K6Version parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxK6V0Document
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxK6V0DocumentName"

  AmazonLinuxK6V1DocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs k6 1.x
      (K6Version parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxK6V1Document
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxK6V1DocumentName"

  AmazonLinuxAwsCliV2DocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs AWS CLI 2.x
      (AwsCliVersion parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxAwsCliV2Document
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxAwsCliV2DocumentName"

  AmazonLinuxGhCliV2DocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs the GitHub CLI 2.x
      (GhCliVersion parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxGhCliV2Document
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxGhCliV2DocumentName"

  AmazonLinuxAzCliV2DocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs the Azure CLI 2.x
      and its azure-devops extension (AzCliVersion parameter) on Amazon Linux
      dev servers.
    Value: !Ref AmazonLinuxAzCliV2Document
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxAzCliV2DocumentName"

  AmazonLinuxSourceControlDocumentName:
    Description: >-
      Name of the shared SSM Command Document that sets up Git source control
      (Action=Setup) and rotates the GitHub / Azure DevOps SSH key
      (Action=RotateSshKey, run on demand) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxSourceControlDocument
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxSourceControlDocumentName"

  # Fleet-wide software versions: the pinned parameters above, echoed so the
  # stack's Outputs tab shows what the associations install. (Output names
  # cannot repeat parameter names, hence the Output suffix.)
  DefaultNodeVersionOutput:
    Description: Node.js major version installed on every dev server.
    Value: !Ref DefaultNodeVersion

  DefaultNpmVersionOutput:
    Description: Exact npm version installed over Node's bundled npm.
    Value: !Ref DefaultNpmVersion

  PowerShell74VersionOutput:
    Description: Exact PowerShell 7.4.x release (servers with PowerShellVersion=v7.4).
    Value: !Ref PowerShell74Version

  PowerShell76VersionOutput:
    Description: Exact PowerShell 7.6.x release (servers with PowerShellVersion=v7.6).
    Value: !Ref PowerShell76Version

  DotNet8VersionOutput:
    Description: .NET 8 SDK version (servers with DotNetVersion=v8).
    Value: !Ref DotNet8Version

  DotNet10VersionOutput:
    Description: .NET 10 SDK version (servers with DotNetVersion=v10).
    Value: !Ref DotNet10Version

  PlaywrightVersionOutput:
    Description: Playwright version whose Chromium is installed (servers with EnablePlaywright=true).
    Value: !Ref PlaywrightVersion

  K6V0VersionOutput:
    Description: Exact k6 0.x release (servers with K6MajorVersion=v0).
    Value: !Ref K6V0Version

  K6V1VersionOutput:
    Description: Exact k6 1.x release (servers with K6MajorVersion=v1).
    Value: !Ref K6V1Version

  AwsCliV2VersionOutput:
    Description: Exact AWS CLI 2.x release (servers with AwsCliMajorVersion=v2).
    Value: !Ref AwsCliV2Version

  GhCliV2VersionOutput:
    Description: Exact GitHub CLI 2.x release (servers with SourceProvider=GitHub).
    Value: !Ref GhCliV2Version

  AzCliV2VersionOutput:
    Description: Exact Azure CLI 2.x release (servers with SourceProvider=AzureDevOps).
    Value: !Ref AzCliV2Version

  VpcId:
    Condition: CreateVpc
    Description: ID of the created VPC.
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  PublicSubnet1Id:
    Condition: CreateVpc
    Description: ID of public subnet 1.
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet1Id"

  PublicSubnet2Id:
    Condition: PublicAz2
    Description: ID of public subnet 2.
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet2Id"

  PublicSubnet3Id:
    Condition: PublicAz3
    Description: ID of public subnet 3.
    Value: !Ref PublicSubnet3
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet3Id"

  PrivateSubnet1Id:
    Condition: CreatePrivate
    Description: ID of private subnet 1.
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet1Id"

  PrivateSubnet2Id:
    Condition: PrivateAz2
    Description: ID of private subnet 2.
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet2Id"

  PrivateSubnet3Id:
    Condition: PrivateAz3
    Description: ID of private subnet 3.
    Value: !Ref PrivateSubnet3
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet3Id"

  DevServerSecurityGroupId:
    Condition: CreateVpc
    Description: ID of the dev-server security group.
    Value: !GetAtt DevServerSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-DevServerSecurityGroupId"
