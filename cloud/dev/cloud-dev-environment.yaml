AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Shared CloudDev environment stack. Always creates an IAM role and instance
  profile for AWS Systems Manager management, and optionally creates a VPC in
  one of two topologies (public, or public-private with a single shared NAT
  gateway) spread across a configurable number of Availability Zones.
  Downstream CloudDev stacks import the exported outputs.

# ---------------------------------------------------------------------------
# Metadata
# ---------------------------------------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: General
        Parameters:
          - StackNamePrefix
          - LogRetentionDays
      - Label:
          default: DNS (optional)
        Parameters:
          - HostedZoneId
      - Label:
          default: Networking
        Parameters:
          - VpcMode
          - AzCount
          - VpcCidr
          - AllowedCidr
      - Label:
          default: Server software versions (fleet-wide, via SSM documents)
        Parameters:
          - DefaultNodeVersion
          - DefaultNpmVersion
          - PowerShell74Version
          - PowerShell76Version
          - DotNet8Version
          - DotNet10Version
          - PlaywrightVersion
          - K6V0Version
          - K6V1Version
          - AwsCliV2Version
          - GhCliV2Version
          - AzCliV2Version
    ParameterLabels:
      StackNamePrefix:
        default: Stack name prefix
      LogRetentionDays:
        default: Bootstrap log retention (days)
      HostedZoneId:
        default: Route 53 hosted zone ID (optional)
      DefaultNodeVersion:
        default: Default Node.js version
      DefaultNpmVersion:
        default: Default npm version
      PowerShell74Version:
        default: PowerShell 7.4 version
      PowerShell76Version:
        default: PowerShell 7.6 version
      DotNet8Version:
        default: .NET 8 SDK version
      DotNet10Version:
        default: .NET 10 SDK version
      PlaywrightVersion:
        default: Playwright version
      K6V0Version:
        default: k6 0.x version
      K6V1Version:
        default: k6 1.x version
      AwsCliV2Version:
        default: AWS CLI 2.x version
      GhCliV2Version:
        default: GitHub CLI 2.x version
      AzCliV2Version:
        default: Azure CLI 2.x version
      VpcMode:
        default: VPC topology
      AzCount:
        default: Availability Zone count
      VpcCidr:
        default: VPC CIDR block
      AllowedCidr:
        default: Allowed SSH CIDR

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  StackNamePrefix:
    Type: String
    Description: >-
      Stack-name prefix that scopes which CloudFormation stacks the shared
      dev-server role may signal (cloudformation:SignalResource). The role's
      policy allows signaling stacks named "<prefix>*", so downstream dev
      stacks created from this environment should use this prefix in their
      stack names.
    Default: CloudDev

  LogRetentionDays:
    Type: Number
    Description: >-
      How many days to retain the shared bootstrap (cloud-init) logs in
      CloudWatch Logs before they expire.
    Default: 7
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90

  HostedZoneId:
    Type: String
    Description: >-
      Optional Route 53 hosted zone ID (in this account). When set, an
      EventBridge rule and Lambda register an A record for each dev server's
      public IP when it reaches "running" and delete it when it stops or is
      terminated. The record is <label>.<zone name>, where label is the
      instance's DnsName tag if present, else its CloudFormation stack name,
      lowercased. Leave empty to create none of this.
    Default: ""
    AllowedPattern: ^(Z[A-Z0-9]+)?$
    ConstraintDescription: Must be empty or a hosted zone ID such as Z0123456789ABCDEFGHIJ.

  DefaultNodeVersion:
    Type: String
    Description: >-
      Fleet-wide default Node.js major version. Baked into the Node config SSM
      document as its NodeVersion parameter default, so every dev server that
      applies the document installs this version. 24 is Active LTS, 22 is
      Maintenance LTS, 26 is Current (as of October 2026).
    Default: "24"
    AllowedValues:
      - "22"
      - "24"
      - "26"

  DefaultNpmVersion:
    Type: String
    Description: >-
      Fleet-wide exact npm version. Baked into the Node config SSM document as
      its NpmVersion parameter default and installed over the npm bundled with
      Node. 12.2.1 is the latest release (as of October 2026); it supports
      Node 22.22.2+, 24.15.0+ and 26+, so it works with every
      DefaultNodeVersion choice.
    Default: "12.2.1"
    AllowedPattern: ^\d+\.\d+\.\d+$
    ConstraintDescription: Must be an exact version, e.g. 12.2.1.

  # Exact, pinned versions for the versioned tool documents, so every dev
  # server gets the same release and rebuilds are reproducible. Nothing floats
  # to "latest": bump a default here (and update the stack) to roll the fleet
  # forward. A value is only used by servers that select that document, but
  # CloudFormation needs a value for every parameter.
  PowerShell74Version:
    Type: String
    Description: >-
      Exact PowerShell 7.4.x release installed by the PowerShell 7.4 document.
      7.4.21 is the latest 7.4 release (as of October 2026).
    Default: "7.4.21"
    AllowedPattern: ^7\.4\.\d+$
    ConstraintDescription: Must be a 7.4.x version, e.g. 7.4.21.

  PowerShell76Version:
    Type: String
    Description: >-
      Exact PowerShell 7.6.x release installed by the PowerShell 7.6 document.
      7.6.8 is the latest 7.6 release, the current LTS line (as of October
      2026).
    Default: "7.6.8"
    AllowedPattern: ^7\.6\.\d+$
    ConstraintDescription: Must be a 7.6.x version, e.g. 7.6.8.

  DotNet8Version:
    Type: String
    Description: >-
      Exact .NET 8 SDK version installed by the .NET 8 document. 8.0.426 is
      the latest 8.0 SDK (as of October 2026).
    Default: "8.0.426"
    AllowedPattern: ^8\.0\.\d+$
    ConstraintDescription: Must be an 8.0.x SDK version, e.g. 8.0.426.

  DotNet10Version:
    Type: String
    Description: >-
      Exact .NET 10 SDK version installed by the .NET 10 document. 10.0.402 is
      the latest 10.0 SDK (as of October 2026).
    Default: "10.0.402"
    AllowedPattern: ^10\.0\.\d+$
    ConstraintDescription: Must be a 10.0.x SDK version, e.g. 10.0.402.

  PlaywrightVersion:
    Type: String
    Description: >-
      Playwright version the Playwright document installs the matching
      Chromium for, into the shared /opt/playwright-browsers. 1.64.1 is the
      latest release (as of October 2026).
    Default: "1.64.1"
    AllowedPattern: ^\d+\.\d+\.\d+$
    ConstraintDescription: Must be an exact version, e.g. 1.64.1.

  K6V0Version:
    Type: String
    Description: >-
      Exact k6 0.x version installed by the k6 0.x document. 0.59.0 is the
      latest 0.x release (as of October 2026).
    Default: "0.59.0"
    AllowedPattern: ^0\.\d+\.\d+$
    ConstraintDescription: Must be a 0.x.y version, e.g. 0.59.0.

  K6V1Version:
    Type: String
    Description: >-
      Exact k6 1.x version installed by the k6 1.x document. 1.8.2 is the
      latest 1.x release (as of October 2026).
    Default: "1.8.2"
    AllowedPattern: ^1\.\d+\.\d+$
    ConstraintDescription: Must be a 1.x.y version, e.g. 1.8.2.

  AwsCliV2Version:
    Type: String
    Description: >-
      Exact AWS CLI 2.x version installed by the AWS CLI 2.x document. 2.38.5
      is the latest 2.x release (as of October 2026).
    Default: "2.38.5"
    AllowedPattern: ^2\.\d+\.\d+$
    ConstraintDescription: Must be a 2.x.y version, e.g. 2.38.5.

  GhCliV2Version:
    Type: String
    Description: >-
      Exact GitHub CLI 2.x version installed by the GitHub CLI 2.x document.
      2.103.0 is the latest 2.x release (as of October 2026).
    Default: "2.103.0"
    AllowedPattern: ^2\.\d+\.\d+$
    ConstraintDescription: Must be a 2.x.y version, e.g. 2.103.0.

  AzCliV2Version:
    Type: String
    Description: >-
      Exact Azure CLI 2.x version installed (with the azure-devops extension)
      by the Azure CLI 2.x document on servers with SourceProvider=AzureDevOps.
      2.91.0 is the latest 2.x release (as of October 2026).
    Default: "2.91.0"
    AllowedPattern: ^2\.\d+\.\d+$
    ConstraintDescription: Must be a 2.x.y version, e.g. 2.91.0.

  VpcMode:
    Type: String
    Description: >-
      Networking topology to create. "none" creates no VPC (bring your own;
      only the IAM role and instance profile are created). "public" creates a
      VPC with an internet gateway and public subnet(s). "public-private" also
      adds private subnet(s) with a single shared NAT gateway.
    Default: none
    AllowedValues:
      - none
      - public
      - public-private

  AzCount:
    Type: Number
    Description: >-
      Number of Availability Zones to spread subnets across. Only relevant when
      a VPC is created (VpcMode != none).
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3

  VpcCidr:
    Type: String
    Description: >-
      CIDR block for the VPC. Must be large enough to carve eight /20 subnets
      (a /16 is the intended default).
    Default: 10.0.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid CIDR range, e.g. 10.0.0.0/16.

  # Required parameter (intentionally no default): there is no safe default for
  # an SSH ingress CIDR. It is only consulted when VpcMode != none, since the
  # security group that uses it is created only then. When VpcMode is none you
  # can pass any valid CIDR (e.g. your IP); it is ignored.
  AllowedCidr:
    Type: String
    Description: >-
      CIDR range allowed to reach the dev-server security group over SSH. Use
      your public IP with /32 for a single address, e.g. 203.0.113.4/32. This
      MUST be set when VpcMode != none; it is only used when a VPC is created.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid CIDR range, e.g. 203.0.113.4/32.

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  DnsEnabled: !Not [!Equals [!Ref HostedZoneId, ""]]
  CreateVpc: !Not [!Equals [!Ref VpcMode, none]]
  CreatePrivate: !Equals [!Ref VpcMode, public-private]
  TwoAzs: !Or [!Equals [!Ref AzCount, 2], !Equals [!Ref AzCount, 3]]
  ThreeAzs: !Equals [!Ref AzCount, 3]
  PublicAz2: !And [!Condition CreateVpc, !Condition TwoAzs]
  PublicAz3: !And [!Condition CreateVpc, !Condition ThreeAzs]
  PrivateAz2: !And [!Condition CreatePrivate, !Condition TwoAzs]
  PrivateAz3: !And [!Condition CreatePrivate, !Condition ThreeAzs]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:
  # CloudWatch Logs group that captures dev-server bootstrap output
  # (/var/log/cloud-init-output.log) so provisioning can be debugged from the
  # console even after a failed instance rolls back and terminates. Owned by
  # the shared environment stack; downstream server stacks stream into it.
  BootstrapLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/clouddev/${AWS::StackName}/bootstrap"
      RetentionInDays: !Ref LogRetentionDays

  # ---- Optional DNS registration (created only when HostedZoneId is set) ----
  # EventBridge delivers EC2 state-change events to a Lambda that keeps one A
  # record per dev server in the hosted zone: UPSERT the public IP on
  # "running", DELETE the record on "stopped"/"terminated". The instances need
  # no Route 53 permission. Only instances tagged CloudDevEnvironment=<this
  # stack> are touched, and the function can only change records in this zone.
  DnsRegistrarLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DnsEnabled
    Properties:
      LogGroupName: !Sub "/clouddev/${AWS::StackName}/dns-registrar"
      RetentionInDays: !Ref LogRetentionDays

  DnsRegistrarRole:
    Type: AWS::IAM::Role
    Condition: DnsEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DnsRegistrar
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                  - route53:ChangeResourceRecordSets
                Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt DnsRegistrarLogGroup.Arn

  DnsRegistrarFunction:
    Type: AWS::Lambda::Function
    Condition: DnsEnabled
    Properties:
      Description: Registers a Route 53 A record for each CloudDev server's public IP.
      Runtime: python3.13
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt DnsRegistrarRole.Arn
      LoggingConfig:
        LogGroup: !Ref DnsRegistrarLogGroup
      Environment:
        Variables:
          HOSTED_ZONE_ID: !Ref HostedZoneId
          ENVIRONMENT_NAME: !Ref AWS::StackName
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import re
          import time

          import boto3

          log = logging.getLogger()
          log.setLevel(logging.INFO)

          ec2 = boto3.client("ec2")
          r53 = boto3.client("route53")

          TTL = 60


          def label_for(instance):
              tags = {t["Key"]: t["Value"] for t in instance.get("Tags", [])}
              raw = tags.get("DnsName") or tags.get("aws:cloudformation:stack-name") or instance["InstanceId"]
              return re.sub(r"[^a-z0-9-]+", "-", raw.lower()).strip("-")


          def describe(instance_id):
              resp = ec2.describe_instances(InstanceIds=[instance_id])
              return resp["Reservations"][0]["Instances"][0]


          def current_record(zone_id, name):
              resp = r53.list_resource_record_sets(
                  HostedZoneId=zone_id, StartRecordName=name, StartRecordType="A", MaxItems="1"
              )
              for rec in resp["ResourceRecordSets"]:
                  if rec["Name"].rstrip(".") == name.rstrip(".") and rec["Type"] == "A":
                      return rec
              return None


          def handler(event, context):
              zone_id = os.environ.get("HOSTED_ZONE_ID", "")
              environment = os.environ.get("ENVIRONMENT_NAME", "")
              if not zone_id:
                  log.info("HOSTED_ZONE_ID is not set; nothing to do")
                  return
              detail = event["detail"]
              instance_id, state = detail["instance-id"], detail["state"]
              log.info("event: instance=%s state=%s", instance_id, state)

              try:
                  instance = describe(instance_id)
              except Exception as exc:
                  log.error("cannot describe %s: %s", instance_id, exc)
                  return
              tags = {t["Key"]: t["Value"] for t in instance.get("Tags", [])}
              if tags.get("CloudDevEnvironment") != environment:
                  log.info("%s is not a %s dev server; ignoring", instance_id, environment)
                  return

              zone_name = r53.get_hosted_zone(Id=zone_id)["HostedZone"]["Name"].rstrip(".")
              name = "%s.%s" % (label_for(instance), zone_name)

              if state == "running":
                  ip = instance.get("PublicIpAddress")
                  for _ in range(6):
                      if ip:
                          break
                      time.sleep(5)
                      ip = describe(instance_id).get("PublicIpAddress")
                  if not ip:
                      log.warning("%s has no public IP; not registering %s", instance_id, name)
                      return
                  r53.change_resource_record_sets(
                      HostedZoneId=zone_id,
                      ChangeBatch={
                          "Comment": "CloudDev %s running" % instance_id,
                          "Changes": [{
                              "Action": "UPSERT",
                              "ResourceRecordSet": {
                                  "Name": name, "Type": "A", "TTL": TTL,
                                  "ResourceRecords": [{"Value": ip}],
                              },
                          }],
                      },
                  )
                  log.info("UPSERT %s A %s", name, ip)
              elif state in ("stopped", "terminated"):
                  rec = current_record(zone_id, name)
                  if not rec:
                      log.info("no A record %s to delete", name)
                      return
                  r53.change_resource_record_sets(
                      HostedZoneId=zone_id,
                      ChangeBatch={
                          "Comment": "CloudDev %s %s" % (instance_id, state),
                          "Changes": [{"Action": "DELETE", "ResourceRecordSet": rec}],
                      },
                  )
                  log.info("DELETE %s A", name)
              else:
                  log.info("state %s ignored", state)

  DnsRegistrarRule:
    Type: AWS::Events::Rule
    Condition: DnsEnabled
    Properties:
      Description: Send EC2 running/stopped/terminated events to the DNS registrar.
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Instance State-change Notification
        detail:
          state:
            - running
            - stopped
            - terminated
      Targets:
        - Id: DnsRegistrar
          Arn: !GetAtt DnsRegistrarFunction.Arn

  DnsRegistrarInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: DnsEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DnsRegistrarFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DnsRegistrarRule.Arn

  # IAM role that lets AWS Systems Manager manage dev instances (Session
  # Manager, Run Command, Patch Manager, etc.). AmazonSSMManagedInstanceCore is
  # the AWS-managed policy that grants the SSM agent the permissions it needs.
  DevServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SignalCreationStatus
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Allow instances using this role to report provisioning status
              # back to their CloudFormation stack. Scoped to stacks whose
              # name starts with the configured prefix.
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackNamePrefix}*/*"
        # Lets a dev server run the source control document (key rotation) on
        # dev servers of this environment, so rotate-git-key needs no extra
        # AWS credentials. SendCommand is checked against the document and the
        # target instance separately. Scoped to the one document and to
        # instances tagged CloudDevEnvironment=<this stack>; it is not limited
        # to the calling instance, because every dev server shares this role.
        - PolicyName: RotateGitSshKey
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${AmazonLinuxSourceControlDocument}"
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    ssm:resourceTag/CloudDevEnvironment: !Ref AWS::StackName
              # Find the document by name and follow the command. These
              # read-only calls do not support resource-level permissions.
              - Effect: Allow
                Action:
                  - ssm:ListDocuments
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"
              # Read this instance's own tags so the rotation names the new key
              # after the server (DnsName tag or stack name). Read-only; the
              # describe call does not support resource-level permissions.
              - Effect: Allow
                Action: ec2:DescribeTags
                Resource: "*"
        - PolicyName: WriteBootstrapLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Allow the CloudWatch agent to stream the bootstrap log into
              # the shared log group (scoped to this group and its streams).
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt BootstrapLogGroup.Arn
                  - !Sub "${BootstrapLogGroup.Arn}:*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ssm-role"

  DevServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DevServerRole

  # Managed, versioned SSM Command Document that installs Node.js/npm (via
  # nvm, system-wide under /opt/nvm) and wires /etc/profile.d/nvm.sh. This
  # replaces the Node install that used to live in the server stack's EC2
  # UserData, so server configuration is maintained/updated/applied through
  # SSM State Manager rather than baked into first-boot. Downstream server
  # stacks apply it via an SSM Association (see the server template).
  #
  # Amazon Linux specific: uses dnf and the ec2-user account. The Ubuntu dev
  # server will need its own document (apt, the ubuntu account).
  AmazonLinuxServerConfigDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Content is authored WITHOUT Fn::Sub: the {{NodeVersion}}/{{NpmVersion}}
      # tokens are SSM document parameters and MUST reach the deployed document
      # literally. There are intentionally NO ${...} CloudFormation variables in
      # this script.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install Node.js and npm (via nvm, system-wide under /opt/nvm) and
          expose them to every login shell through /etc/profile.d/nvm.sh.
        parameters:
          NodeVersion:
            type: String
            description: Node.js major version to install via nvm.
            # Fleet-wide default from the DefaultNodeVersion stack parameter.
            # !Sub only touches ${...}; the {{NodeVersion}} placeholders in the
            # runCommand below are left literal.
            default: !Sub "${DefaultNodeVersion}"
          NpmVersion:
            type: String
            description: Exact npm version to install over the one bundled with Node.
            # Fleet-wide pin from the DefaultNpmVersion stack parameter.
            default: !Sub "${DefaultNpmVersion}"
        mainSteps:
          - action: aws:runShellScript
            name: installNodeAndNpm
            inputs:
              runCommand:
                - set -euxo pipefail
                # SSM runs commands as root but does NOT set HOME; nvm needs it
                # and under 'set -u' an unbound HOME aborts the script. Export it.
                - export HOME=/root
                - dnf install -y git tar gzip gcc-c++ make
                - export NVM_DIR=/opt/nvm
                - mkdir -p "$NVM_DIR"
                - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | NVM_DIR="$NVM_DIR" bash
                - . "$NVM_DIR/nvm.sh"
                - nvm install "{{NodeVersion}}"
                - nvm alias default "{{NodeVersion}}"
                - nvm use default
                - npm install -g "npm@{{NpmVersion}}"
                - printf 'export NVM_DIR="/opt/nvm"\n[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"\n' > /etc/profile.d/nvm.sh
                - chmod +x /etc/profile.d/nvm.sh
                - chown -R ec2-user:ec2-user /opt/nvm

  # Versioned SSM Command Documents that install PowerShell (pwsh) on Amazon
  # Linux via Microsoft's per-architecture tarball, so they work on both
  # x86_64 and arm64 instances (the script picks the right tarball from
  # uname). ONE DOCUMENT PER RELEASE LINE (7.4, 7.6); the exact release comes
  # from the environment stack's PowerShell<line>Version parameter, passed by
  # the association (the documents themselves have no default). A server picks a line with the
  # CloudDevPowerShellConfig tag VALUE. Amazon Linux specific.
  AmazonLinuxPowerShellV74Document:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{PowerShellVersion}} is an SSM document
      # parameter and must reach the deployed document literally. There are
      # intentionally NO ${...} CloudFormation variables in this script.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install PowerShell 7.4.x from Microsoft's per-architecture tarball
          into /opt/microsoft/powershell/7 and symlink /usr/bin/pwsh. Works on
          both x86_64 and arm64 Amazon Linux.
        parameters:
          PowerShellVersion:
            type: String
            description: PowerShell 7.4.x version to install (e.g. 7.4.13).
            allowedPattern: ^7\.4\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installPowerShell
            inputs:
              runCommand:
                - set -euxo pipefail
                - PS_VERSION="{{PowerShellVersion}}"
                - |
                  case "$(uname -m)" in
                    x86_64)  PS_ARCH="x64" ;;
                    aarch64) PS_ARCH="arm64" ;;
                    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                  esac
                - dnf install -y tar gzip libicu
                - INSTALL_DIR="/opt/microsoft/powershell/7"
                # Replace any previously installed release so switching
                # versions leaves exactly one pwsh.
                - rm -rf "$INSTALL_DIR"
                - mkdir -p "$INSTALL_DIR"
                - TARBALL="/tmp/powershell-$PS_VERSION-linux-$PS_ARCH.tar.gz"
                - URL="https://github.com/PowerShell/PowerShell/releases/download/v$PS_VERSION/powershell-$PS_VERSION-linux-$PS_ARCH.tar.gz"
                - curl -sSfL "$URL" -o "$TARBALL"
                - tar -xzf "$TARBALL" -C "$INSTALL_DIR"
                - chmod +x "$INSTALL_DIR/pwsh"
                - ln -sf "$INSTALL_DIR/pwsh" /usr/bin/pwsh
                - rm -f "$TARBALL"
                - /usr/bin/pwsh --version

  AmazonLinuxPowerShellV76Document:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{PowerShellVersion}} is an SSM document
      # parameter and must reach the deployed document literally. There are
      # intentionally NO ${...} CloudFormation variables in this script.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install PowerShell 7.6.x from Microsoft's per-architecture tarball
          into /opt/microsoft/powershell/7 and symlink /usr/bin/pwsh. Works on
          both x86_64 and arm64 Amazon Linux.
        parameters:
