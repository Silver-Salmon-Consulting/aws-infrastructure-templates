AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Remote development server. Provisions a single EC2 instance (Amazon Linux 2023)
  with a security group that restricts SSH access to a single IP, and installs
  Node.js / npm at the requested versions via nvm.

# ---------------------------------------------------------------------------
# Metadata
# ---------------------------------------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Shared environment (from CloudDev environment stack)
        Parameters:
          - EnvironmentStackName
          - OllamaClientSecurityGroupId
      - Label:
          default: Network
        Parameters:
          - VpcId
          - SubnetId
          - AllowedCidr
          - DnsName
      - Label:
          default: Server
        Parameters:
          - KeyPairName
          - InstanceType
          - VolumeSize
          - LatestAmiId
      - Label:
          default: Workspace disk (code and caches; survives server rebuilds)
        Parameters:
          - ServerEnabled
          - WorkspaceVolumeSize
          - WorkspaceSnapshotId
      - Label:
          default: Idle auto-stop safeguard
        Parameters:
          - EnableIdleShutdown
          - IdleCpuThresholdPercent
          - IdleNetworkThresholdMB
          - IdleStopPeriods
      - Label:
          default: Software (installed via shared SSM documents)
        Parameters:
          - PowerShellVersion
          - EnablePlaywright
          - DotNetVersion
          - K6MajorVersion
          - AwsCliMajorVersion
      - Label:
          default: Source control
        Parameters:
          - SourceProvider
          - GitUserName
          - GitUserEmail
    ParameterLabels:
      EnvironmentStackName:
        default: CloudDev environment stack name
      OllamaClientSecurityGroupId:
        default: Ollama client security group (optional)
      VpcId:
        default: VPC
      SubnetId:
        default: Subnet
      AllowedCidr:
        default: Allowed SSH CIDR (optional; empty = Session Manager only)
      DnsName:
        default: DNS name (optional)
      KeyPairName:
        default: Key pair
      InstanceType:
        default: Instance type
      VolumeSize:
        default: Root volume size (GiB)
      LatestAmiId:
        default: AMI (SSM parameter)
      ServerEnabled:
        default: Server enabled
      WorkspaceVolumeSize:
        default: Workspace volume size (GiB)
      WorkspaceSnapshotId:
        default: Restore workspace from snapshot (optional)
      EnableIdleShutdown:
        default: Enable idle auto-stop
      IdleCpuThresholdPercent:
        default: Idle CPU threshold (%)
      IdleNetworkThresholdMB:
        default: Idle network threshold (MB per 5 min)
      IdleStopPeriods:
        default: Idle 5-min periods before stop
      PowerShellVersion:
        default: PowerShell version
      EnablePlaywright:
        default: Install Playwright dependencies
      DotNetVersion:
        default: .NET SDK major version
      K6MajorVersion:
        default: k6 major version
      AwsCliMajorVersion:
        default: AWS CLI (official installer) major version
      SourceProvider:
        default: Source control provider
      GitUserName:
        default: Git user.name (optional)
      GitUserEmail:
        default: Git user.email (optional)

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  EnvironmentStackName:
    Type: String
    Description: >-
      Name of the deployed CloudDev environment stack. The IAM instance
      profile and bootstrap CloudWatch log group are imported from its exported
      outputs (via Fn::ImportValue), so you only supply the stack name here.
    Default: CloudDevEnv


  OllamaClientSecurityGroupId:
    Type: String
    Description: >-
      Optional. The OllamaClientSecurityGroupId output of a CloudDev Ollama
      server stack. When set, it is attached to this server so it can reach
      Ollama on TCP 11434. Leave empty to skip.
    Default: ""
    AllowedPattern: ^(sg-[0-9a-f]{8,17})?$
    ConstraintDescription: Must be empty or a security group ID, e.g. sg-0123456789abcdef0.


  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which to create the security group and dev server.


  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      Public subnet (within the chosen VPC) to launch the instance into.
      Must have a route to an internet gateway for SSH access and package
      downloads.


  AllowedCidr:
    Type: String
    Description: >-
      Optional CIDR range allowed to reach the dev server over SSH on port 22.
      Use your public IP with /32 for a single address, e.g. 203.0.113.4/32.
      Leave empty (the default) to open no inbound port at all and connect
      through Session Manager (see the README, "Connecting"), which also
      carries SSH and VS Code Remote-SSH.
    Default: ""
    AllowedPattern: ^((\d{1,3}\.){3}\d{1,3}/\d{1,2})?$
    ConstraintDescription: Must be empty or a valid CIDR range, e.g. 203.0.113.4/32.

  DnsName:
    Type: String
    Description: >-
      Optional DNS label for this server (e.g. "music-dev"). Only used when the
      CloudDev environment stack has a HostedZoneId: the server then gets an A
      record <label>.<zone name> for its public IP while it is running. Leave
      empty to use the stack name as the label.
    Default: ""
    AllowedPattern: ^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)?$
    ConstraintDescription: Must be empty or a single DNS label (letters, digits and hyphens).


  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 key pair to enable SSH access.


  InstanceType:
    Type: String
    Description: >-
      EC2 instance size for the dev server. These are AMD (x86_64) instance
      families: t3a is burstable, m5a is general purpose, c5a is compute
      optimized. All pair with the x86_64 AMI (the default LatestAmiId below).
    Default: t3a.medium
    AllowedValues:
      - t3a.small
      - t3a.medium
      - t3a.large
      - t3a.xlarge
      - t3a.2xlarge
      - m5a.large
      - m5a.xlarge
      - c5a.large
      - c5a.xlarge


  VolumeSize:
    Type: Number
    Description: >-
      Root EBS volume size in GiB: the OS, installed tools, SSH keys and
      credentials. It is replaced with the server; code and caches live on the
      workspace volume instead.
    Default: 30
    MinValue: 8
    MaxValue: 1000


  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: >-
      SSM parameter that resolves to the latest Amazon Linux 2023 AMI.
      Leave as the default unless you have a reason to change it.
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64


  # The workspace volume belongs to the stack, not the server: rebuilding the
  # server (ServerEnabled false then true, or an AMI update that replaces it)
  # keeps it, and deleting the stack leaves a final snapshot.
  ServerEnabled:
    Type: String
    Description: >-
      "false" deletes the server (and its root volume) but keeps the
      workspace volume; set it back to "true" to get a fresh server with the
      same workspace. Use it to rebuild a server or to park a project.
    Default: "true"
    AllowedValues:
      - "true"
      - "false"


  WorkspaceVolumeSize:
    Type: Number
    Description: >-
      Workspace volume size in GiB, mounted at /workspace (~/code, package
      caches, VS Code server). Can be increased later without a rebuild (the
      file system grows within 30 minutes); EBS volumes cannot shrink.
    Default: 20
    MinValue: 1
    MaxValue: 1000


  WorkspaceSnapshotId:
    Type: String
    Description: >-
      Optional. Create the workspace volume from this EBS snapshot, e.g. the
      final snapshot of a deleted stack or one taken before moving to another
      Availability Zone. Leave empty for a new, empty workspace. Change it
      (or move SubnetId to another zone) only while ServerEnabled is "false":
      it replaces the volume, and the old one is snapshotted.
    Default: ""
    AllowedPattern: ^(snap-[0-9a-f]{8,17})?$
    ConstraintDescription: Must be empty or a snapshot ID, e.g. snap-0123456789abcdef0.


  EnableIdleShutdown:
    Type: String
    Description: >-
      Create a CloudWatch alarm that STOPS (not terminates) the instance when
      CPU and network traffic both stay below the idle thresholds for the
      configured window. A cost
      safeguard for a forgotten-running dev box.
    Default: "true"
    AllowedValues:
      - "true"
      - "false"


  IdleCpuThresholdPercent:
    Type: Number
    Description: >-
      Average CPUUtilization (percent) below which the instance is considered
      idle. Only used when EnableIdleShutdown is true.
    Default: 5
    MinValue: 1
    MaxValue: 100


  IdleNetworkThresholdMB:
    Type: Number
    Description: >-
      Combined NetworkIn + NetworkOut (megabytes per 5-minute period) below
      which the instance is considered idle. Both this AND the CPU threshold
      must be met for a period to count as idle, so background CPU noise
      alone no longer keeps a quiet box running (and a busy download does not
      get it stopped). Only used when EnableIdleShutdown is true.
    Default: 5
    MinValue: 0.1
    MaxValue: 10000


  IdleStopPeriods:
    Type: Number
    Description: >-
      Number of consecutive 5-minute periods CPU must stay below the idle
      threshold before the instance is stopped. EC2 basic monitoring publishes
      CPUUtilization every 5 minutes, so the alarm uses a 300-second period and
      this is the number of those periods (e.g. 12 = 60 minutes). Only used
      when EnableIdleShutdown is true.
    Default: 12
    MinValue: 1
    MaxValue: 288


  # Versioned tools (see K6MajorVersion below): the value IS the tag value,
  # selecting the environment stack's matching per-version association.
  PowerShellVersion:
    Type: String
    Description: >-
      PowerShell release line to install (the exact release is set by the
      environment stack), or "none" to skip PowerShell.
    Default: none
    AllowedValues:
      - none
      - v7.4
      - v7.6


  EnablePlaywright:
    Type: String
    Description: >-
      Install the system libraries and fonts Playwright's Chromium needs, plus
      the Chromium build for the environment stack's PlaywrightVersion, by
      applying the shared Playwright SSM document from the environment stack.
    Default: "false"
    AllowedValues:
      - "true"
      - "false"


  DotNetVersion:
    Type: String
    Description: >-
      .NET SDK major version to install under /opt/dotnet (the exact SDK is
      set by the environment stack), or "none" to skip .NET.
    Default: none
    AllowedValues:
      - none
      - v8
      - v10


  # Versioned tools: the value IS the CloudDev<Tool>Config tag value, which
  # selects the environment stack's matching per-major-version association
  # (the newest release in that major is installed). "none" matches nothing.
  K6MajorVersion:
    Type: String
    Description: >-
      k6 major version to install into /usr/local/bin/k6 (latest release in
      that major), or "none" to skip k6.
    Default: none
    AllowedValues:
      - none
      - v0
      - v1


  AwsCliMajorVersion:
    Type: String
    Description: >-
      Install the latest AWS CLI release in this major version with AWS's
      official installer (/usr/local/bin/aws), or "none" to keep only the
      AL2023 awscli-2 package (/usr/bin/aws).
    Default: none
    AllowedValues:
      - none
      - v2


  # The value IS the CloudDevSourceProvider tag value. It also selects the
  # provider's CLI: CloudDevGhCliConfig / CloudDevAzCliConfig = v2.
  SourceProvider:
    Type: String
    Description: >-
      Where this server's Git repos live. GitHub installs the GitHub CLI (gh);
      AzureDevOps installs the Azure CLI (az) with its azure-devops extension.
      Either way the server gets rotate-git-key and a code directory, and
      rotate-git-key makes the right SSH key type (ed25519 for GitHub,
      ssh-rsa for Azure DevOps). "none" sets up neither.
    Default: GitHub
    AllowedValues:
      - GitHub
      - AzureDevOps
      - none


  # Passed to the instance as the CloudDevGitUserName / CloudDevGitUserEmail
  # tags, so the patterns only allow characters EC2 tag values accept.
  GitUserName:
    Type: String
    Description: >-
      Optional. Git user.name for ec2-user (git config --global), applied by
      the source control setup, so it needs a SourceProvider other than
      "none". Leave empty to leave user.name alone.
    Default: ""
    AllowedPattern: ^[\p{L}\p{N} ._:/=+@-]{0,256}$
    ConstraintDescription: >-
      Must be at most 256 letters, digits, spaces and . _ : / = + @ -
      (the characters EC2 tag values allow).


  GitUserEmail:
    Type: String
    Description: >-
      Optional. Git user.email for ec2-user (git config --global), applied
      like GitUserName. Leave empty to leave user.email alone.
    Default: ""
    AllowedPattern: ^([A-Za-z0-9._+-]+@[A-Za-z0-9.-]+)?$
    ConstraintDescription: Must be empty or an email address, e.g. dev@example.com.

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  HasDnsName: !Not [!Equals [!Ref DnsName, ""]]
  AllowSsh: !Not [!Equals [!Ref AllowedCidr, ""]]
  AttachOllamaClientSg: !Not [!Equals [!Ref OllamaClientSecurityGroupId, ""]]
  CreateServer: !Equals [!Ref ServerEnabled, "true"]
  HasWorkspaceSnapshot: !Not [!Equals [!Ref WorkspaceSnapshotId, ""]]
  IdleShutdownEnabled: !And
    - !Equals [!Ref EnableIdleShutdown, "true"]
    - !Condition CreateServer
  PlaywrightEnabled: !Equals [!Ref EnablePlaywright, "true"]
  UsesGitHub: !Equals [!Ref SourceProvider, GitHub]
  UsesAzureDevOps: !Equals [!Ref SourceProvider, AzureDevOps]
  HasGitUserName: !Not [!Equals [!Ref GitUserName, ""]]
  HasGitUserEmail: !Not [!Equals [!Ref GitUserEmail, ""]]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:
  DevServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Access for ${AWS::StackName} dev server; SSH only from AllowedCidr, none if empty."
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - !If
          - AllowSsh
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref AllowedCidr
            Description: SSH from the configured local IP.
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic.
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sg"

  # Code, package caches and the VS Code server, kept across server rebuilds.
  # The environment stack's workspace document attaches it (CloudFormation
  # cannot: it would try before a replaced instance lets go of the volume),
  # formats it only when blank and mounts it at /workspace. Snapshotted when
  # the stack is deleted or the volume is replaced.
  # The subnet's Availability Zone, looked up by the environment stack's
  # subnet lookup function (CloudFormation cannot read it from a subnet ID).
  SubnetInfo:
    Type: Custom::SubnetInfo
    Properties:
      ServiceToken:
        Fn::ImportValue: !Sub "${EnvironmentStackName}-SubnetLookupFunctionArn"
      SubnetId: !Ref SubnetId

  WorkspaceVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !GetAtt SubnetInfo.AvailabilityZone
      Size: !Ref WorkspaceVolumeSize
      SnapshotId: !If [HasWorkspaceSnapshot, !Ref WorkspaceSnapshotId, !Ref AWS::NoValue]
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-workspace"
        # Lets this environment's dev server role attach it.
        - Key: CloudDevEnvironment
          Value: !Ref EnvironmentStackName
        # Selects it for the environment stack's optional daily snapshots.
        - Key: CloudDevWorkspace
          Value: !Ref EnvironmentStackName

  DevServerInstance:
    Type: AWS::EC2::Instance
    Condition: CreateServer
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile:
        Fn::ImportValue: !Sub "${EnvironmentStackName}-DevServerInstanceProfileName"
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !GetAtt DevServerSecurityGroup.GroupId
        - !If [AttachOllamaClientSg, !Ref OllamaClientSecurityGroupId, !Ref AWS::NoValue]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-dev-server"
        # Marks the instance as belonging to this CloudDev environment. The
        # CloudDev permission set scopes start/stop and SSM commands to it.
        - Key: CloudDevEnvironment
          Value: !Ref EnvironmentStackName
        # DNS label for the environment stack's optional Route 53 registrar;
        # without it the label is derived from the stack name.
        - !If
          - HasDnsName
          - Key: DnsName
            Value: !Ref DnsName
          - !Ref AWS::NoValue
        # Opts this server into the environment stack's NodeConfigAssociation
        # (installs Node/npm via the shared SSM document). Every dev server
        # gets Node. Remove this tag to decouple from the association.
        - Key: CloudDevNodeConfig
          Value: enabled
        # Selects the environment stack's per-version PowerShell association
        # by tag value (v7.4 | v7.6); "none" matches nothing.
        - Key: CloudDevPowerShellConfig
          Value: !Ref PowerShellVersion
        # Opts into the environment stack's PlaywrightConfigAssociation when
        # EnablePlaywright=true (same enabled/disabled pattern as above).
        - Key: CloudDevPlaywrightConfig
          Value: !If [PlaywrightEnabled, "enabled", "disabled"]
        # Selects the environment stack's per-major .NET SDK association by
        # tag value (v8 | v10); "none" matches nothing.
        - Key: CloudDevDotNetConfig
          Value: !Ref DotNetVersion
        # jq, zip and unzip. Every dev server gets them, like Node.
        - Key: CloudDevBaseToolsConfig
          Value: enabled
        # Versioned tools: the tag value picks one per-major-version
        # association (v0, v1, ...); "none" matches none of them.
        - Key: CloudDevK6Config
          Value: !Ref K6MajorVersion
        - Key: CloudDevAwsCliConfig
          Value: !Ref AwsCliMajorVersion
        # Source control: the provider picks the source control association
        # (SSH key rotation, rotate-git-key, code directory) and its CLI.
        - Key: CloudDevSourceProvider
          Value: !Ref SourceProvider
        - Key: CloudDevGhCliConfig
          Value: !If [UsesGitHub, v2, none]
        - Key: CloudDevAzCliConfig
          Value: !If [UsesAzureDevOps, v2, none]
        # Git identity for ec2-user, applied by the source control setup.
        # Tag values cannot be empty, so each tag is left off when unset.
        - !If
          - HasGitUserName
          - Key: CloudDevGitUserName
            Value: !Ref GitUserName
          - !Ref AWS::NoValue
        - !If
          - HasGitUserEmail
          - Key: CloudDevGitUserEmail
            Value: !Ref GitUserEmail
          - !Ref AWS::NoValue
        # Workspace volume: the environment stack's workspace association
        # attaches the volume named here and mounts it at /workspace.
        - Key: CloudDevWorkspaceConfig
          Value: enabled
        - Key: CloudDevWorkspaceVolumeId
          Value: !Ref WorkspaceVolume
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euxo pipefail

              # Signal CloudFormation using the AWS CLI (preinstalled on Amazon
              # Linux 2023), rather than cfn-signal / aws-cfn-bootstrap which is not
              # installed on AL2023 and is fragile to install via pip. The trap is
              # set BEFORE any package install so that even a failure reports a
              # FAILURE signal instead of letting the stack wait out its timeout.
              REGION="${AWS::Region}"
              STACK_NAME="${AWS::StackName}"
              STACK_PREFIX="${StackNamePrefix}"

              # Everything below is logged with a timestamp to cloud-init-output.log
              # (streamed to the bootstrap CloudWatch log group), the journal and the
              # EC2 console output, so a signalling problem can be diagnosed without
              # logging in.
              log() {
                local line="[cfn-signal $(date -u +%Y-%m-%dT%H:%M:%SZ)] $*"
                echo "$line"
                logger -t cfn-signal -- "$*" || true
                echo "$line" > /dev/console 2>/dev/null || true
              }

              TOKEN=$(curl -sS -X PUT "http://169.254.169.254/latest/api/token" \
                -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
              INSTANCE_ID=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" \
                http://169.254.169.254/latest/meta-data/instance-id)

              log "stack=$STACK_NAME resource=DevServerInstance instance=$INSTANCE_ID region=$REGION"
              log "aws cli: $(command -v aws || echo not-found) $(aws --version 2>&1 || true)"
              log "caller identity: $(aws sts get-caller-identity --query Arn --output text 2>&1 || true)"

              # Preflight: the dev server role may only signal stacks whose name starts
              # with the environment stack's StackNamePrefix. Check it now and say so
              # loudly, because otherwise the denied signal is only visible after the
              # CreationPolicy timeout.
              case "$STACK_NAME" in
                "$STACK_PREFIX"*)
                  log "stack name matches the environment StackNamePrefix '$STACK_PREFIX'; signalling is permitted"
                  ;;
                *)
                  log "ERROR: stack name '$STACK_NAME' does not start with the environment StackNamePrefix '$STACK_PREFIX'."
                  log "ERROR: the dev server role is not allowed to signal this stack, so CloudFormation will fail it after the CreationPolicy timeout. Delete the stack and recreate it with a name starting with '$STACK_PREFIX'."
                  ;;
              esac

              # On failure, copy the tail of the bootstrap log to CloudWatch Logs
              # (stream <instance-id>/bootstrap-failure) BEFORE signalling, because
              # CloudFormation deletes the instance on rollback and the CloudWatch
              # agent may not be running yet. Best-effort; never fails the script.
              ship_failure_log() {
                local group="${BootstrapLogGroupName}" stream="$INSTANCE_ID/bootstrap-failure"
                aws logs create-log-stream --log-group-name "$group" --log-stream-name "$stream" --region "$REGION" || true
                tail -n 300 /var/log/cloud-init-output.log 2>/dev/null | python3 -c '
              import json, sys, time
              lines = [l.rstrip("\n")[:8000] or " " for l in sys.stdin]
              lines = lines or ["(no bootstrap log lines available)"]
              now = int(time.time() * 1000)
              print(json.dumps([{"timestamp": now + i, "message": m} for i, m in enumerate(lines)]))
              ' > /tmp/bootstrap-failure-events.json || true
                aws logs put-log-events --log-group-name "$group" --log-stream-name "$stream" \
                  --log-events file:///tmp/bootstrap-failure-events.json --region "$REGION" > /dev/null \
                  && log "copied the last bootstrap log lines to $group / $stream" \
                  || log "could not copy the bootstrap log to CloudWatch Logs"
              }

              signal_cfn() {
                local status="$1" out rc attempt
                for attempt in 1 2 3; do
                  rc=0
                  out=$(aws cloudformation signal-resource \
                    --stack-name "$STACK_NAME" \
                    --logical-resource-id DevServerInstance \
                    --unique-id "$INSTANCE_ID" \
                    --status "$status" \
                    --region "$REGION" 2>&1) || rc=$?
                  if [ "$rc" -eq 0 ]; then
                    log "sent $status signal to $STACK_NAME (attempt $attempt)"
                    return 0
                  fi
                  log "signal-resource $status failed (attempt $attempt, exit $rc): $out"
                  case "$out" in
                    *AccessDenied*|*"not authorized"*)
                      log "ERROR: access denied signalling $STACK_NAME. The role only allows stacks named '$STACK_PREFIX*'; check the stack name and the role's SignalCreationStatus policy."
                      break
                      ;;
                  esac
                  sleep 5
                done
                log "ERROR: could not deliver the $status signal; CloudFormation will fail this resource when the CreationPolicy times out."
                return 0
              }
              # Record which command failed (set -e stops the script there).
              set -E
              trap 'log "ERROR: command failed (exit $?) at line $LINENO: $BASH_COMMAND"' ERR
              trap 'rc=$?; log "bootstrap script exiting with status $rc"; if [ "$rc" -eq 0 ]; then signal_cfn SUCCESS; else ship_failure_log; signal_cfn FAILURE; fi' EXIT

              # NOTE: no package installs here. UserData only needs to start the
              # CloudWatch agent and signal CloudFormation; it compiles nothing.
              # Build tooling (git, gcc-c++, make) and Node are installed by the
              # shared SSM document, applied via the tag-targeted association in
              # the environment stack. The previous "dnf install gcc-c++ make"
              # here pulled kernel-headers, which conflicts with the preinstalled
              # kernel6.18-headers on current AL2023 and aborted the script.

              # Best-effort CloudWatch agent so this bootstrap script's output
              # (cloud-init-output.log) streams to CloudWatch Logs for easier
              # debugging. This is a convenience, NOT a health dependency: the
              # whole block runs in a subshell with '|| true' so a missing
              # package or agent error can never fail the instance (and thus the
              # stack). If it fails, logs are still on disk and in the EC2
              # console output.
              (
                set -x
                dnf install -y amazon-cloudwatch-agent
                cat > /opt/aws/amazon-cloudwatch-agent/etc/bootstrap-logs.json <<'CWCONFIG'
              {
                "logs": {
                  "logs_collected": {
                    "files": {
                      "collect_list": [
                        {
                          "file_path": "/var/log/cloud-init-output.log",
                          "log_group_name": "${BootstrapLogGroupName}",
                          "log_stream_name": "{instance_id}/cloud-init-output"
                        }
                      ]
                    }
                  }
                }
              }
              CWCONFIG
                /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
                  -a fetch-config -m ec2 -s \
                  -c file:/opt/aws/amazon-cloudwatch-agent/etc/bootstrap-logs.json
              ) || echo "WARNING: CloudWatch agent setup failed; continuing (logs still on disk / console)."

              # cloud-init runs UserData as root but does NOT set HOME. Exported
              # here harmlessly; Node.js/npm are now installed by the shared SSM
              # Command Document (applied via the environment stack's
              # tag-targeted NodeConfigAssociation), not by this UserData, so
              # first-boot no longer waits on Node.
              export HOME=/root

              # Provisioning finished successfully; the EXIT trap above sends the
              # success signal to CloudFormation. The CreationPolicy gates ONLY on
              # instance boot/signal health here; Node/npm install success is tracked
              # separately as SSM State Manager compliance.
            - BootstrapLogGroupName:
                Fn::ImportValue: !Sub "${EnvironmentStackName}-BootstrapLogGroupName"
              StackNamePrefix:
                Fn::ImportValue: !Sub "${EnvironmentStackName}-StackNamePrefix"
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M

  # Cost safeguard: stop (not terminate) the instance when a 5-minute period
  # is "idle" (average CPU below IdleCpuThresholdPercent AND NetworkIn +
  # NetworkOut below IdleNetworkThresholdMB) for IdleStopPeriods consecutive
  # periods. CPU alone was too easily held above the threshold by background
  # agents, so the box never stopped. Metric math emits 1 for an idle period;
  # the alarm fires when that stays >= 1. CloudWatch does not allow the
  # built-in EC2 'stop' alarm action on metric-math alarms, so the stop is done
  # by an EventBridge rule and Lambda (IdleStop* below).
  # Period is 300s to match EC2 basic monitoring. TreatMissingData is
  # notBreaching so a gap in metrics never triggers a stop. Created only when
  # EnableIdleShutdown=true.
  IdleShutdownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IdleShutdownEnabled
    Properties:
      AlarmName: !Sub "${AWS::StackName}-idle-shutdown"
      AlarmDescription: !Sub >-
        Stops ${AWS::StackName} when CPU is below ${IdleCpuThresholdPercent}%
        and network traffic is below ${IdleNetworkThresholdMB} MB per period
        for ${IdleStopPeriods} consecutive 5-minute periods.
      Metrics:
        - Id: idle
          Expression: !Sub "IF(cpu < ${IdleCpuThresholdPercent} AND (netin + netout) / 1048576 < ${IdleNetworkThresholdMB}, 1, 0)"
          Label: Idle (1 = idle)
          ReturnData: true
        - Id: cpu
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/EC2
              MetricName: CPUUtilization
              Dimensions:
                - Name: InstanceId
                  Value: !Ref DevServerInstance
            Period: 300
            Stat: Average
        - Id: netin
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/EC2
              MetricName: NetworkIn
              Dimensions:
                - Name: InstanceId
                  Value: !Ref DevServerInstance
            Period: 300
            Stat: Sum
        - Id: netout
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/EC2
              MetricName: NetworkOut
              Dimensions:
                - Name: InstanceId
                  Value: !Ref DevServerInstance
            Period: 300
            Stat: Sum
      EvaluationPeriods: !Ref IdleStopPeriods
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # CloudWatch does not allow EC2 actions (arn:aws:automate:...:ec2:stop) on
  # metric-math alarms, so the alarm above has no action. Instead EventBridge
  # sends its ALARM state change to this small Lambda, which stops (not
  # terminates) only this stack's instance. Created only when
  # EnableIdleShutdown=true.
  IdleStopRole:
    Type: AWS::IAM::Role
    Condition: IdleShutdownEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: StopThisInstance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${DevServerInstance}"

  IdleStopFunction:
    Type: AWS::Lambda::Function
    Condition: IdleShutdownEnabled
    Properties:
      Description: Stops this dev server when its idle alarm fires.
      Runtime: python3.13
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt IdleStopRole.Arn
      Environment:
        Variables:
          INSTANCE_ID: !Ref DevServerInstance
      Code:
        ZipFile: |
          import logging
          import os

          import boto3

          log = logging.getLogger()
          log.setLevel(logging.INFO)


          def handler(event, context):
              instance_id = os.environ["INSTANCE_ID"]
              alarm = event.get("detail", {}).get("alarmName")
              log.info("idle alarm %s fired; stopping %s", alarm, instance_id)
              boto3.client("ec2").stop_instances(InstanceIds=[instance_id])

  IdleStopRule:
    Type: AWS::Events::Rule
    Condition: IdleShutdownEnabled
    Properties:
      Description: Stop the dev server when its idle alarm goes to ALARM.
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - CloudWatch Alarm State Change
        detail:
          alarmName:
            - !Ref IdleShutdownAlarm
          state:
            value:
              - ALARM
      Targets:
        - Id: IdleStop
          Arn: !GetAtt IdleStopFunction.Arn

  IdleStopInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: IdleShutdownEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IdleStopFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IdleStopRule.Arn

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  InstanceId:
    Condition: CreateServer
    Description: ID of the dev server EC2 instance.
    Value: !Ref DevServerInstance

  WorkspaceVolumeId:
    Description: >-
      ID of the workspace EBS volume (mounted at /workspace), kept when the
      server is rebuilt.
    Value: !Ref WorkspaceVolume

  # No public IP / DNS / SSH outputs: the public IP is ephemeral (it changes on
  # every stop/start, which the idle auto-stop alarm triggers), so outputting it
  # would surface stale values and fail the stack when no public IP is assigned.
  # Connect via Session Manager instead, which targets the stable instance ID,
  # needs no open SSH port, and uses the attached SSM role.
  SessionManagerCommand:
    Condition: CreateServer
    Description: >-
      Connect to the dev server via AWS Systems Manager Session Manager
      (no SSH key or open port required).
    Value: !Sub "aws ssm start-session --target ${DevServerInstance} --region ${AWS::Region}"
