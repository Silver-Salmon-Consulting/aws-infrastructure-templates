AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Remote development server. Provisions a single EC2 instance (Amazon Linux 2023)
  with a security group that restricts SSH access to a single IP, and installs
  Node.js / npm at the requested versions via nvm.

# ---------------------------------------------------------------------------
# Metadata
# ---------------------------------------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Shared environment (from CloudDev environment stack)
        Parameters:
          - EnvironmentStackName
      - Label:
          default: Idle auto-stop safeguard
        Parameters:
          - EnableIdleShutdown
          - IdleCpuThresholdPercent
          - IdleNetworkThresholdMB
          - IdleStopPeriods
      - Label:
          default: Software (installed via shared SSM documents)
        Parameters:
          - EnablePowerShell
          - EnablePlaywright
          - EnableDotNet8
          - EnableDotNet10
          - K6MajorVersion
          - AwsCliMajorVersion
    ParameterLabels:
      EnvironmentStackName:
        default: CloudDev environment stack name
      EnableIdleShutdown:
        default: Enable idle auto-stop
      IdleCpuThresholdPercent:
        default: Idle CPU threshold (%)
      IdleNetworkThresholdMB:
        default: Idle network threshold (MB per 5 min)
      IdleStopPeriods:
        default: Idle 5-min periods before stop
      EnablePowerShell:
        default: Install PowerShell
      EnablePlaywright:
        default: Install Playwright dependencies
      EnableDotNet8:
        default: Install .NET 8 SDK
      EnableDotNet10:
        default: Install .NET 10 SDK
      K6MajorVersion:
        default: k6 major version
      AwsCliMajorVersion:
        default: AWS CLI (official installer) major version

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  EnvironmentStackName:
    Type: String
    Description: >-
      Name of the deployed CloudDev environment stack. The IAM instance
      profile and bootstrap CloudWatch log group are imported from its exported
      outputs (via Fn::ImportValue), so you only supply the stack name here.
    Default: CloudDevEnv

  AllowedCidr:
    Type: String
    Description: >-
      CIDR range allowed to reach the dev server over SSH. Use your public IP
      with /32 for a single address, e.g. 203.0.113.4/32.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid CIDR range, e.g. 203.0.113.4/32.

  InstanceType:
    Type: String
    Description: >-
      EC2 instance size for the dev server. These are AMD (x86_64) instance
      families: t3a is burstable, m5a is general purpose, c5a is compute
      optimized. All pair with the x86_64 AMI (the default LatestAmiId below).
    Default: t3a.medium
    AllowedValues:
      - t3a.small
      - t3a.medium
      - t3a.large
      - t3a.xlarge
      - t3a.2xlarge
      - m5a.large
      - m5a.xlarge
      - c5a.large
      - c5a.xlarge

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 key pair to enable SSH access.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which to create the security group and dev server.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      Public subnet (within the chosen VPC) to launch the instance into.
      Must have a route to an internet gateway for SSH access and package
      downloads.

  VolumeSize:
    Type: Number
    Description: Root EBS volume size in GiB.
    Default: 30
    MinValue: 8
    MaxValue: 1000

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: >-
      SSM parameter that resolves to the latest Amazon Linux 2023 AMI.
      Leave as the default unless you have a reason to change it.
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  EnableIdleShutdown:
    Type: String
    Description: >-
      Create a CloudWatch alarm that STOPS (not terminates) the instance when
      CPU and network traffic both stay below the idle thresholds for the
      configured window. A cost
      safeguard for a forgotten-running dev box.
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  IdleCpuThresholdPercent:
    Type: Number
    Description: >-
      Average CPUUtilization (percent) below which the instance is considered
      idle. Only used when EnableIdleShutdown is true.
    Default: 5
    MinValue: 1
    MaxValue: 100

  IdleNetworkThresholdMB:
    Type: Number
    Description: >-
      Combined NetworkIn + NetworkOut (megabytes per 5-minute period) below
      which the instance is considered idle. Both this AND the CPU threshold
      must be met for a period to count as idle, so background CPU noise
      alone no longer keeps a quiet box running (and a busy download does not
      get it stopped). Only used when EnableIdleShutdown is true.
    Default: 5
    MinValue: 0.1
    MaxValue: 10000

  IdleStopPeriods:
    Type: Number
    Description: >-
      Number of consecutive 5-minute periods CPU must stay below the idle
      threshold before the instance is stopped. EC2 basic monitoring publishes
      CPUUtilization every 5 minutes, so the alarm uses a 300-second period and
      this is the number of those periods (e.g. 12 = 60 minutes). Only used
      when EnableIdleShutdown is true.
    Default: 12
    MinValue: 1
    MaxValue: 288

  EnablePowerShell:
    Type: String
    Description: >-
      Install PowerShell (pwsh) on the instance by applying the shared
      PowerShell SSM document from the environment stack.
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  EnablePlaywright:
    Type: String
    Description: >-
      Install the system libraries and fonts Playwright's Chromium needs by
      applying the shared Playwright SSM document from the environment stack.
      Browser binaries are not installed; run `npx playwright install
      chromium` in your project.
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  EnableDotNet8:
    Type: String
    Description: >-
      Install the .NET 8 SDK (side by side under /opt/dotnet) by applying the
      shared .NET SDK SSM document from the environment stack.
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  EnableDotNet10:
    Type: String
    Description: >-
      Install the .NET 10 SDK (side by side under /opt/dotnet) by applying the
      shared .NET SDK SSM document from the environment stack.
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  # Versioned tools: the value IS the CloudDev<Tool>Config tag value, which
  # selects the environment stack's matching per-major-version association
  # (the newest release in that major is installed). "none" matches nothing.
  K6MajorVersion:
    Type: String
    Description: >-
      k6 major version to install into /usr/local/bin/k6 (latest release in
      that major), or "none" to skip k6.
    Default: none
    AllowedValues:
      - none
      - v0
      - v1

  AwsCliMajorVersion:
    Type: String
    Description: >-
      Install the latest AWS CLI release in this major version with AWS's
      official installer (/usr/local/bin/aws), or "none" to keep only the
      AL2023 awscli-2 package (/usr/bin/aws).
    Default: none
    AllowedValues:
      - none
      - v2

  # PowerShellVersion is intentionally NOT a server-stack parameter. The
  # fleet-wide PowerShell version is owned by the CloudDev environment stack
  # (its DefaultPowerShellVersion param, baked into the PowerShell SSM
  # document's default), so the association below passes no version and the
  # document default governs.

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  IdleShutdownEnabled: !Equals [!Ref EnableIdleShutdown, "true"]
  PowerShellEnabled: !Equals [!Ref EnablePowerShell, "true"]
  PlaywrightEnabled: !Equals [!Ref EnablePlaywright, "true"]
  DotNet8Enabled: !Equals [!Ref EnableDotNet8, "true"]
  DotNet10Enabled: !Equals [!Ref EnableDotNet10, "true"]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:
  DevServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "SSH access for ${AWS::StackName} dev server, restricted to a single IP."
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCidr
          Description: SSH from the configured local IP.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic.
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sg"

  DevServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile:
        Fn::ImportValue: !Sub "${EnvironmentStackName}-DevServerInstanceProfileName"
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !GetAtt DevServerSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-dev-server"
        # Marks the instance as belonging to this CloudDev environment. The
        # CloudDev permission set scopes start/stop and SSM commands to it.
        - Key: CloudDevEnvironment
          Value: !Ref EnvironmentStackName
        # Opts this server into the environment stack's NodeConfigAssociation
        # (installs Node/npm via the shared SSM document). Every dev server
        # gets Node. Remove this tag to decouple from the association.
        - Key: CloudDevNodeConfig
          Value: enabled
        # Opts into the environment stack's PowerShellConfigAssociation when
        # EnablePowerShell=true. "disabled" simply does not match the
        # association target, so pwsh is skipped without needing a
        # conditional resource.
        - Key: CloudDevPowerShellConfig
          Value: !If [PowerShellEnabled, "enabled", "disabled"]
        # Opts into the environment stack's PlaywrightConfigAssociation when
        # EnablePlaywright=true (same enabled/disabled pattern as above).
        - Key: CloudDevPlaywrightConfig
          Value: !If [PlaywrightEnabled, "enabled", "disabled"]
        # Opt into the environment stack's per-channel .NET SDK associations.
        - Key: CloudDevDotNet8Config
          Value: !If [DotNet8Enabled, "enabled", "disabled"]
        - Key: CloudDevDotNet10Config
          Value: !If [DotNet10Enabled, "enabled", "disabled"]
        # jq, zip and unzip. Every dev server gets them, like Node.
        - Key: CloudDevBaseToolsConfig
          Value: enabled
        # Versioned tools: the tag value picks one per-major-version
        # association (v0, v1, ...); "none" matches none of them.
        - Key: CloudDevK6Config
          Value: !Ref K6MajorVersion
        - Key: CloudDevAwsCliConfig
          Value: !Ref AwsCliMajorVersion
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euxo pipefail

              # Signal CloudFormation using the AWS CLI (preinstalled on Amazon
              # Linux 2023), rather than cfn-signal / aws-cfn-bootstrap which is not
              # installed on AL2023 and is fragile to install via pip. The trap is
              # set BEFORE any package install so that even a dnf failure reports a
              # FAILURE signal instead of letting the stack wait out its timeout.
              REGION="${AWS::Region}"
              TOKEN=$(curl -sS -X PUT "http://169.254.169.254/latest/api/token" \
                -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
              INSTANCE_ID=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" \
                http://169.254.169.254/latest/meta-data/instance-id)

              signal_cfn() {
                local status="$1"
                aws cloudformation signal-resource \
                  --stack-name "${AWS::StackName}" \
                  --logical-resource-id DevServerInstance \
                  --unique-id "$INSTANCE_ID" \
                  --status "$status" \
                  --region "$REGION" || true
              }
              trap '[ $? -eq 0 ] && signal_cfn SUCCESS || signal_cfn FAILURE' EXIT

              # NOTE: no package installs here. UserData only needs to start the
              # CloudWatch agent and signal CloudFormation; it compiles nothing.
              # Build tooling (git, gcc-c++, make) and Node are installed by the
              # shared SSM document, applied via the tag-targeted association in
              # the environment stack. The previous "dnf install gcc-c++ make"
              # here pulled kernel-headers, which conflicts with the preinstalled
              # kernel6.18-headers on current AL2023 and aborted the script.

              # Best-effort CloudWatch agent so this bootstrap script's output
              # (cloud-init-output.log) streams to CloudWatch Logs for easier
              # debugging. This is a convenience, NOT a health dependency: the
              # whole block runs in a subshell with '|| true' so a missing
              # package or agent error can never fail the instance (and thus the
              # stack). If it fails, logs are still on disk and in the EC2
              # console output.
              (
                set -x
                dnf install -y amazon-cloudwatch-agent
                cat > /opt/aws/amazon-cloudwatch-agent/etc/bootstrap-logs.json <<'CWCONFIG'
              {
                "logs": {
                  "logs_collected": {
                    "files": {
                      "collect_list": [
                        {
                          "file_path": "/var/log/cloud-init-output.log",
                          "log_group_name": "${BootstrapLogGroupName}",
                          "log_stream_name": "{instance_id}/cloud-init-output"
                        }
                      ]
                    }
                  }
                }
              }
              CWCONFIG
                /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
                  -a fetch-config -m ec2 -s \
                  -c file:/opt/aws/amazon-cloudwatch-agent/etc/bootstrap-logs.json
              ) || echo "WARNING: CloudWatch agent setup failed; continuing (logs still on disk / console)."

              # cloud-init runs UserData as root but does NOT set HOME. Exported
              # here harmlessly; Node.js/npm are now installed by the shared SSM
              # Command Document (applied via the environment stack's
              # tag-targeted NodeConfigAssociation), not by this UserData, so
              # first-boot no longer waits on Node.
              export HOME=/root

              # Provisioning finished successfully; the EXIT trap above sends the
              # success signal to CloudFormation. The CreationPolicy gates ONLY on
              # instance boot/signal health here; Node/npm install success is tracked
              # separately as SSM State Manager compliance.
            - BootstrapLogGroupName:
                Fn::ImportValue: !Sub "${EnvironmentStackName}-BootstrapLogGroupName"
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M

  # Cost safeguard: stop (not terminate) the instance when a 5-minute period
  # is "idle" (average CPU below IdleCpuThresholdPercent AND NetworkIn +
  # NetworkOut below IdleNetworkThresholdMB) for IdleStopPeriods consecutive
  # periods. CPU alone was too easily held above the threshold by background
  # agents, so the box never stopped. Metric math emits 1 for an idle period;
  # the alarm fires when that stays >= 1. Every underlying metric carries the
  # InstanceId dimension, which the built-in EC2 'stop' alarm action
  # (arn:aws:automate:...:ec2:stop) requires; no Lambda or IAM role needed.
  # Period is 300s to match EC2 basic monitoring. TreatMissingData is
  # notBreaching so a gap in metrics never triggers a stop. Created only when
  # EnableIdleShutdown=true.
  IdleShutdownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IdleShutdownEnabled
    Properties:
      AlarmName: !Sub "${AWS::StackName}-idle-shutdown"
      AlarmDescription: !Sub >-
        Stops ${AWS::StackName} when CPU is below ${IdleCpuThresholdPercent}%
        and network traffic is below ${IdleNetworkThresholdMB} MB per period
        for ${IdleStopPeriods} consecutive 5-minute periods.
      Metrics:
        - Id: idle
          Expression: !Sub "IF(cpu < ${IdleCpuThresholdPercent} AND (netin + netout) / 1048576 < ${IdleNetworkThresholdMB}, 1, 0)"
          Label: Idle (1 = idle)
          ReturnData: true
        - Id: cpu
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/EC2
              MetricName: CPUUtilization
              Dimensions:
                - Name: InstanceId
                  Value: !Ref DevServerInstance
            Period: 300
            Stat: Average
        - Id: netin
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/EC2
              MetricName: NetworkIn
              Dimensions:
                - Name: InstanceId
                  Value: !Ref DevServerInstance
            Period: 300
            Stat: Sum
        - Id: netout
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/EC2
              MetricName: NetworkOut
              Dimensions:
                - Name: InstanceId
                  Value: !Ref DevServerInstance
            Period: 300
            Stat: Sum
      EvaluationPeriods: !Ref IdleStopPeriods
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub "arn:${AWS::Partition}:automate:${AWS::Region}:ec2:stop"

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  InstanceId:
    Description: ID of the dev server EC2 instance.
    Value: !Ref DevServerInstance

  # No public IP / DNS / SSH outputs: the public IP is ephemeral (it changes on
  # every stop/start, which the idle auto-stop alarm triggers), so outputting it
  # would surface stale values and fail the stack when no public IP is assigned.
  # Connect via Session Manager instead, which targets the stable instance ID,
  # needs no open SSH port, and uses the attached SSM role.
  SessionManagerCommand:
    Description: >-
      Connect to the dev server via AWS Systems Manager Session Manager
      (no SSH key or open port required).
    Value: !Sub "aws ssm start-session --target ${DevServerInstance} --region ${AWS::Region}"
