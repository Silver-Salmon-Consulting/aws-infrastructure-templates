AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Shared CloudDev environment stack. Always creates an IAM role and instance
  profile for AWS Systems Manager management, and optionally creates a VPC in
  one of two topologies (public, or public-private with a single shared NAT
  gateway) spread across a configurable number of Availability Zones.
  Downstream CloudDev stacks import the exported outputs.

# ---------------------------------------------------------------------------
# Metadata
# ---------------------------------------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: General
        Parameters:
          - StackNamePrefix
          - LogRetentionDays
      - Label:
          default: DNS (optional)
        Parameters:
          - HostedZoneId
      - Label:
          default: Networking
        Parameters:
          - VpcMode
          - AzCount
          - VpcCidr
          - AllowedCidr
      - Label:
          default: Server software versions (fleet-wide, via SSM documents)
        Parameters:
          - DefaultNodeVersion
          - DefaultNpmVersion
          - PowerShell74Version
          - PowerShell76Version
          - DotNet8Version
          - DotNet10Version
          - PlaywrightVersion
          - K6V0Version
          - K6V1Version
          - AwsCliV2Version
          - GhCliV2Version
    ParameterLabels:
      StackNamePrefix:
        default: Stack name prefix
      LogRetentionDays:
        default: Bootstrap log retention (days)
      HostedZoneId:
        default: Route 53 hosted zone ID (optional)
      DefaultNodeVersion:
        default: Default Node.js version
      DefaultNpmVersion:
        default: Default npm version
      PowerShell74Version:
        default: PowerShell 7.4 version
      PowerShell76Version:
        default: PowerShell 7.6 version
      DotNet8Version:
        default: .NET 8 SDK version
      DotNet10Version:
        default: .NET 10 SDK version
      PlaywrightVersion:
        default: Playwright version
      K6V0Version:
        default: k6 0.x version
      K6V1Version:
        default: k6 1.x version
      AwsCliV2Version:
        default: AWS CLI 2.x version
      GhCliV2Version:
        default: GitHub CLI 2.x version
      VpcMode:
        default: VPC topology
      AzCount:
        default: Availability Zone count
      VpcCidr:
        default: VPC CIDR block
      AllowedCidr:
        default: Allowed SSH CIDR

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  StackNamePrefix:
    Type: String
    Description: >-
      Stack-name prefix that scopes which CloudFormation stacks the shared
      dev-server role may signal (cloudformation:SignalResource). The role's
      policy allows signaling stacks named "<prefix>*", so downstream dev
      stacks created from this environment should use this prefix in their
      stack names.
    Default: CloudDev

  LogRetentionDays:
    Type: Number
    Description: >-
      How many days to retain the shared bootstrap (cloud-init) logs in
      CloudWatch Logs before they expire.
    Default: 7
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90

  HostedZoneId:
    Type: String
    Description: >-
      Optional Route 53 hosted zone ID (in this account). When set, an
      EventBridge rule and Lambda register an A record for each dev server's
      public IP when it reaches "running" and delete it when it stops or is
      terminated. The record is <label>.<zone name>, where label is the
      instance's DnsName tag if present, else its CloudFormation stack name,
      lowercased. Leave empty to create none of this.
    Default: ""
    AllowedPattern: ^(Z[A-Z0-9]+)?$
    ConstraintDescription: Must be empty or a hosted zone ID such as Z0123456789ABCDEFGHIJ.

  DefaultNodeVersion:
    Type: String
    Description: >-
      Fleet-wide default Node.js major version. Baked into the Node config SSM
      document as its NodeVersion parameter default, so every dev server that
      applies the document installs this version. 24 is Active LTS, 22 is
      Maintenance LTS, 26 is Current (as of October 2026).
    Default: "24"
    AllowedValues:
      - "22"
      - "24"
      - "26"

  DefaultNpmVersion:
    Type: String
    Description: >-
      Fleet-wide exact npm version. Baked into the Node config SSM document as
      its NpmVersion parameter default and installed over the npm bundled with
      Node. 12.2.1 is the latest release (as of October 2026); it supports
      Node 22.22.2+, 24.15.0+ and 26+, so it works with every
      DefaultNodeVersion choice.
    Default: "12.2.1"
    AllowedPattern: ^\d+\.\d+\.\d+$
    ConstraintDescription: Must be an exact version, e.g. 12.2.1.

  # Exact, pinned versions for the versioned tool documents, so every dev
  # server gets the same release and rebuilds are reproducible. Nothing floats
  # to "latest": bump a default here (and update the stack) to roll the fleet
  # forward. A value is only used by servers that select that document, but
  # CloudFormation needs a value for every parameter.
  PowerShell74Version:
    Type: String
    Description: >-
      Exact PowerShell 7.4.x release installed by the PowerShell 7.4 document.
      7.4.21 is the latest 7.4 release (as of October 2026).
    Default: "7.4.21"
    AllowedPattern: ^7\.4\.\d+$
    ConstraintDescription: Must be a 7.4.x version, e.g. 7.4.21.

  PowerShell76Version:
    Type: String
    Description: >-
      Exact PowerShell 7.6.x release installed by the PowerShell 7.6 document.
      7.6.8 is the latest 7.6 release, the current LTS line (as of October
      2026).
    Default: "7.6.8"
    AllowedPattern: ^7\.6\.\d+$
    ConstraintDescription: Must be a 7.6.x version, e.g. 7.6.8.

  DotNet8Version:
    Type: String
    Description: >-
      Exact .NET 8 SDK version installed by the .NET 8 document. 8.0.426 is
      the latest 8.0 SDK (as of October 2026).
    Default: "8.0.426"
    AllowedPattern: ^8\.0\.\d+$
    ConstraintDescription: Must be an 8.0.x SDK version, e.g. 8.0.426.

  DotNet10Version:
    Type: String
    Description: >-
      Exact .NET 10 SDK version installed by the .NET 10 document. 10.0.402 is
      the latest 10.0 SDK (as of October 2026).
    Default: "10.0.402"
    AllowedPattern: ^10\.0\.\d+$
    ConstraintDescription: Must be a 10.0.x SDK version, e.g. 10.0.402.

  PlaywrightVersion:
    Type: String
    Description: >-
      Playwright version the Playwright document installs the matching
      Chromium for, into the shared /opt/playwright-browsers. 1.64.1 is the
      latest release (as of October 2026).
    Default: "1.64.1"
    AllowedPattern: ^\d+\.\d+\.\d+$
    ConstraintDescription: Must be an exact version, e.g. 1.64.1.

  K6V0Version:
    Type: String
    Description: >-
      Exact k6 0.x version installed by the k6 0.x document. 0.59.0 is the
      latest 0.x release (as of October 2026).
    Default: "0.59.0"
    AllowedPattern: ^0\.\d+\.\d+$
    ConstraintDescription: Must be a 0.x.y version, e.g. 0.59.0.

  K6V1Version:
    Type: String
    Description: >-
      Exact k6 1.x version installed by the k6 1.x document. 1.8.2 is the
      latest 1.x release (as of October 2026).
    Default: "1.8.2"
    AllowedPattern: ^1\.\d+\.\d+$
    ConstraintDescription: Must be a 1.x.y version, e.g. 1.8.2.

  AwsCliV2Version:
    Type: String
    Description: >-
      Exact AWS CLI 2.x version installed by the AWS CLI 2.x document. 2.38.5
      is the latest 2.x release (as of October 2026).
    Default: "2.38.5"
    AllowedPattern: ^2\.\d+\.\d+$
    ConstraintDescription: Must be a 2.x.y version, e.g. 2.38.5.

  GhCliV2Version:
    Type: String
    Description: >-
      Exact GitHub CLI 2.x version installed by the GitHub CLI 2.x document.
      2.103.0 is the latest 2.x release (as of October 2026).
    Default: "2.103.0"
    AllowedPattern: ^2\.\d+\.\d+$
    ConstraintDescription: Must be a 2.x.y version, e.g. 2.103.0.

  VpcMode:
    Type: String
    Description: >-
      Networking topology to create. "none" creates no VPC (bring your own;
      only the IAM role and instance profile are created). "public" creates a
      VPC with an internet gateway and public subnet(s). "public-private" also
      adds private subnet(s) with a single shared NAT gateway.
    Default: none
    AllowedValues:
      - none
      - public
      - public-private

  AzCount:
    Type: Number
    Description: >-
      Number of Availability Zones to spread subnets across. Only relevant when
      a VPC is created (VpcMode != none).
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3

  VpcCidr:
    Type: String
    Description: >-
      CIDR block for the VPC. Must be large enough to carve eight /20 subnets
      (a /16 is the intended default).
    Default: 10.0.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid CIDR range, e.g. 10.0.0.0/16.

  # Required parameter (intentionally no default): there is no safe default for
  # an SSH ingress CIDR. It is only consulted when VpcMode != none, since the
  # security group that uses it is created only then. When VpcMode is none you
  # can pass any valid CIDR (e.g. your IP); it is ignored.
  AllowedCidr:
    Type: String
    Description: >-
      CIDR range allowed to reach the dev-server security group over SSH. Use
      your public IP with /32 for a single address, e.g. 203.0.113.4/32. This
      MUST be set when VpcMode != none; it is only used when a VPC is created.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid CIDR range, e.g. 203.0.113.4/32.

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  DnsEnabled: !Not [!Equals [!Ref HostedZoneId, ""]]
  CreateVpc: !Not [!Equals [!Ref VpcMode, none]]
  CreatePrivate: !Equals [!Ref VpcMode, public-private]
  TwoAzs: !Or [!Equals [!Ref AzCount, 2], !Equals [!Ref AzCount, 3]]
  ThreeAzs: !Equals [!Ref AzCount, 3]
  PublicAz2: !And [!Condition CreateVpc, !Condition TwoAzs]
  PublicAz3: !And [!Condition CreateVpc, !Condition ThreeAzs]
  PrivateAz2: !And [!Condition CreatePrivate, !Condition TwoAzs]
  PrivateAz3: !And [!Condition CreatePrivate, !Condition ThreeAzs]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:
  # CloudWatch Logs group that captures dev-server bootstrap output
  # (/var/log/cloud-init-output.log) so provisioning can be debugged from the
  # console even after a failed instance rolls back and terminates. Owned by
  # the shared environment stack; downstream server stacks stream into it.
  BootstrapLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/clouddev/${AWS::StackName}/bootstrap"
      RetentionInDays: !Ref LogRetentionDays

  # ---- Optional DNS registration (created only when HostedZoneId is set) ----
  # EventBridge delivers EC2 state-change events to a Lambda that keeps one A
  # record per dev server in the hosted zone: UPSERT the public IP on
  # "running", DELETE the record on "stopped"/"terminated". The instances need
  # no Route 53 permission. Only instances tagged CloudDevEnvironment=<this
  # stack> are touched, and the function can only change records in this zone.
  DnsRegistrarLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DnsEnabled
    Properties:
      LogGroupName: !Sub "/clouddev/${AWS::StackName}/dns-registrar"
      RetentionInDays: !Ref LogRetentionDays

  DnsRegistrarRole:
    Type: AWS::IAM::Role
    Condition: DnsEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DnsRegistrar
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                  - route53:ChangeResourceRecordSets
                Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt DnsRegistrarLogGroup.Arn

  DnsRegistrarFunction:
    Type: AWS::Lambda::Function
    Condition: DnsEnabled
    Properties:
      Description: Registers a Route 53 A record for each CloudDev server's public IP.
      Runtime: python3.13
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt DnsRegistrarRole.Arn
      LoggingConfig:
        LogGroup: !Ref DnsRegistrarLogGroup
      Environment:
        Variables:
          HOSTED_ZONE_ID: !Ref HostedZoneId
          ENVIRONMENT_NAME: !Ref AWS::StackName
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import re
          import time

          import boto3

          log = logging.getLogger()
          log.setLevel(logging.INFO)

          ec2 = boto3.client("ec2")
          r53 = boto3.client("route53")

          TTL = 60


          def label_for(instance):
              tags = {t["Key"]: t["Value"] for t in instance.get("Tags", [])}
              raw = tags.get("DnsName") or tags.get("aws:cloudformation:stack-name") or instance["InstanceId"]
              return re.sub(r"[^a-z0-9-]+", "-", raw.lower()).strip("-")


          def describe(instance_id):
              resp = ec2.describe_instances(InstanceIds=[instance_id])
              return resp["Reservations"][0]["Instances"][0]


          def current_record(zone_id, name):
              resp = r53.list_resource_record_sets(
                  HostedZoneId=zone_id, StartRecordName=name, StartRecordType="A", MaxItems="1"
              )
              for rec in resp["ResourceRecordSets"]:
                  if rec["Name"].rstrip(".") == name.rstrip(".") and rec["Type"] == "A":
                      return rec
              return None


          def handler(event, context):
              zone_id = os.environ.get("HOSTED_ZONE_ID", "")
              environment = os.environ.get("ENVIRONMENT_NAME", "")
              if not zone_id:
                  log.info("HOSTED_ZONE_ID is not set; nothing to do")
                  return
              detail = event["detail"]
              instance_id, state = detail["instance-id"], detail["state"]
              log.info("event: instance=%s state=%s", instance_id, state)

              try:
                  instance = describe(instance_id)
              except Exception as exc:
                  log.error("cannot describe %s: %s", instance_id, exc)
                  return
              tags = {t["Key"]: t["Value"] for t in instance.get("Tags", [])}
              if tags.get("CloudDevEnvironment") != environment:
                  log.info("%s is not a %s dev server; ignoring", instance_id, environment)
                  return

              zone_name = r53.get_hosted_zone(Id=zone_id)["HostedZone"]["Name"].rstrip(".")
              name = "%s.%s" % (label_for(instance), zone_name)

              if state == "running":
                  ip = instance.get("PublicIpAddress")
                  for _ in range(6):
                      if ip:
                          break
                      time.sleep(5)
                      ip = describe(instance_id).get("PublicIpAddress")
                  if not ip:
                      log.warning("%s has no public IP; not registering %s", instance_id, name)
                      return
                  r53.change_resource_record_sets(
                      HostedZoneId=zone_id,
                      ChangeBatch={
                          "Comment": "CloudDev %s running" % instance_id,
                          "Changes": [{
                              "Action": "UPSERT",
                              "ResourceRecordSet": {
                                  "Name": name, "Type": "A", "TTL": TTL,
                                  "ResourceRecords": [{"Value": ip}],
                              },
                          }],
                      },
                  )
                  log.info("UPSERT %s A %s", name, ip)
              elif state in ("stopped", "terminated"):
                  rec = current_record(zone_id, name)
                  if not rec:
                      log.info("no A record %s to delete", name)
                      return
                  r53.change_resource_record_sets(
                      HostedZoneId=zone_id,
                      ChangeBatch={
                          "Comment": "CloudDev %s %s" % (instance_id, state),
                          "Changes": [{"Action": "DELETE", "ResourceRecordSet": rec}],
                      },
                  )
                  log.info("DELETE %s A", name)
              else:
                  log.info("state %s ignored", state)

  DnsRegistrarRule:
    Type: AWS::Events::Rule
    Condition: DnsEnabled
    Properties:
      Description: Send EC2 running/stopped/terminated events to the DNS registrar.
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Instance State-change Notification
        detail:
          state:
            - running
            - stopped
            - terminated
      Targets:
        - Id: DnsRegistrar
          Arn: !GetAtt DnsRegistrarFunction.Arn

  DnsRegistrarInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: DnsEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DnsRegistrarFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DnsRegistrarRule.Arn

  # IAM role that lets AWS Systems Manager manage dev instances (Session
  # Manager, Run Command, Patch Manager, etc.). AmazonSSMManagedInstanceCore is
  # the AWS-managed policy that grants the SSM agent the permissions it needs.
  DevServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SignalCreationStatus
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Allow instances using this role to report provisioning status
              # back to their CloudFormation stack. Scoped to stacks whose
              # name starts with the configured prefix.
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackNamePrefix}*/*"
        # Lets a dev server run the GitHub document (key rotation) on dev
        # servers of this environment, so rotate-github-key needs no extra
        # AWS credentials. SendCommand is checked against the document and the
        # target instance separately. Scoped to the one document and to
        # instances tagged CloudDevEnvironment=<this stack>; it is not limited
        # to the calling instance, because every dev server shares this role.
        - PolicyName: RotateGitHubSshKey
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${AmazonLinuxGhCliV2Document}"
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    ssm:resourceTag/CloudDevEnvironment: !Ref AWS::StackName
              # Find the document by name and follow the command. These
              # read-only calls do not support resource-level permissions.
              - Effect: Allow
                Action:
                  - ssm:ListDocuments
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"
        - PolicyName: WriteBootstrapLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Allow the CloudWatch agent to stream the bootstrap log into
              # the shared log group (scoped to this group and its streams).
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt BootstrapLogGroup.Arn
                  - !Sub "${BootstrapLogGroup.Arn}:*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ssm-role"

  DevServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DevServerRole

  # Managed, versioned SSM Command Document that installs Node.js/npm (via
  # nvm, system-wide under /opt/nvm) and wires /etc/profile.d/nvm.sh. This
  # replaces the Node install that used to live in the server stack's EC2
  # UserData, so server configuration is maintained/updated/applied through
  # SSM State Manager rather than baked into first-boot. Downstream server
  # stacks apply it via an SSM Association (see the server template).
  #
  # Amazon Linux specific: uses dnf and the ec2-user account. The Ubuntu dev
  # server will need its own document (apt, the ubuntu account).
  AmazonLinuxServerConfigDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Content is authored WITHOUT Fn::Sub: the {{NodeVersion}}/{{NpmVersion}}
      # tokens are SSM document parameters and MUST reach the deployed document
      # literally. There are intentionally NO ${...} CloudFormation variables in
      # this script.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install Node.js and npm (via nvm, system-wide under /opt/nvm) and
          expose them to every login shell through /etc/profile.d/nvm.sh.
        parameters:
          NodeVersion:
            type: String
            description: Node.js major version to install via nvm.
            # Fleet-wide default from the DefaultNodeVersion stack parameter.
            # !Sub only touches ${...}; the {{NodeVersion}} placeholders in the
            # runCommand below are left literal.
            default: !Sub "${DefaultNodeVersion}"
          NpmVersion:
            type: String
            description: Exact npm version to install over the one bundled with Node.
            # Fleet-wide pin from the DefaultNpmVersion stack parameter.
            default: !Sub "${DefaultNpmVersion}"
        mainSteps:
          - action: aws:runShellScript
            name: installNodeAndNpm
            inputs:
              runCommand:
                - set -euxo pipefail
                # SSM runs commands as root but does NOT set HOME; nvm needs it
                # and under 'set -u' an unbound HOME aborts the script. Export it.
                - export HOME=/root
                - dnf install -y git tar gzip gcc-c++ make
                - export NVM_DIR=/opt/nvm
                - mkdir -p "$NVM_DIR"
                - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | NVM_DIR="$NVM_DIR" bash
                - . "$NVM_DIR/nvm.sh"
                - nvm install "{{NodeVersion}}"
                - nvm alias default "{{NodeVersion}}"
                - nvm use default
                - npm install -g "npm@{{NpmVersion}}"
                - printf 'export NVM_DIR="/opt/nvm"\n[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"\n' > /etc/profile.d/nvm.sh
                - chmod +x /etc/profile.d/nvm.sh
                - chown -R ec2-user:ec2-user /opt/nvm

  # Versioned SSM Command Documents that install PowerShell (pwsh) on Amazon
  # Linux via Microsoft's per-architecture tarball, so they work on both
  # x86_64 and arm64 instances (the script picks the right tarball from
  # uname). ONE DOCUMENT PER RELEASE LINE (7.4, 7.6); the exact release comes
  # from the environment stack's PowerShell<line>Version parameter, passed by
  # the association (the documents themselves have no default). A server picks a line with the
  # CloudDevPowerShellConfig tag VALUE. Amazon Linux specific.
  AmazonLinuxPowerShellV74Document:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{PowerShellVersion}} is an SSM document
      # parameter and must reach the deployed document literally. There are
      # intentionally NO ${...} CloudFormation variables in this script.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install PowerShell 7.4.x from Microsoft's per-architecture tarball
          into /opt/microsoft/powershell/7 and symlink /usr/bin/pwsh. Works on
          both x86_64 and arm64 Amazon Linux.
        parameters:
          PowerShellVersion:
            type: String
            description: PowerShell 7.4.x version to install (e.g. 7.4.13).
            allowedPattern: ^7\.4\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installPowerShell
            inputs:
              runCommand:
                - set -euxo pipefail
                - PS_VERSION="{{PowerShellVersion}}"
                - |
                  case "$(uname -m)" in
                    x86_64)  PS_ARCH="x64" ;;
                    aarch64) PS_ARCH="arm64" ;;
                    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                  esac
                - dnf install -y tar gzip libicu
                - INSTALL_DIR="/opt/microsoft/powershell/7"
                # Replace any previously installed release so switching
                # versions leaves exactly one pwsh.
                - rm -rf "$INSTALL_DIR"
                - mkdir -p "$INSTALL_DIR"
                - TARBALL="/tmp/powershell-$PS_VERSION-linux-$PS_ARCH.tar.gz"
                - URL="https://github.com/PowerShell/PowerShell/releases/download/v$PS_VERSION/powershell-$PS_VERSION-linux-$PS_ARCH.tar.gz"
                - curl -sSfL "$URL" -o "$TARBALL"
                - tar -xzf "$TARBALL" -C "$INSTALL_DIR"
                - chmod +x "$INSTALL_DIR/pwsh"
                - ln -sf "$INSTALL_DIR/pwsh" /usr/bin/pwsh
                - rm -f "$TARBALL"
                - /usr/bin/pwsh --version

  AmazonLinuxPowerShellV76Document:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{PowerShellVersion}} is an SSM document
      # parameter and must reach the deployed document literally. There are
      # intentionally NO ${...} CloudFormation variables in this script.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install PowerShell 7.6.x from Microsoft's per-architecture tarball
          into /opt/microsoft/powershell/7 and symlink /usr/bin/pwsh. Works on
          both x86_64 and arm64 Amazon Linux.
        parameters:
          PowerShellVersion:
            type: String
            description: PowerShell 7.6.x version to install (e.g. 7.6.6).
            allowedPattern: ^7\.6\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installPowerShell
            inputs:
              runCommand:
                - set -euxo pipefail
                - PS_VERSION="{{PowerShellVersion}}"
                - |
                  case "$(uname -m)" in
                    x86_64)  PS_ARCH="x64" ;;
                    aarch64) PS_ARCH="arm64" ;;
                    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                  esac
                - dnf install -y tar gzip libicu
                - INSTALL_DIR="/opt/microsoft/powershell/7"
                # Replace any previously installed release so switching
                # versions leaves exactly one pwsh.
                - rm -rf "$INSTALL_DIR"
                - mkdir -p "$INSTALL_DIR"
                - TARBALL="/tmp/powershell-$PS_VERSION-linux-$PS_ARCH.tar.gz"
                - URL="https://github.com/PowerShell/PowerShell/releases/download/v$PS_VERSION/powershell-$PS_VERSION-linux-$PS_ARCH.tar.gz"
                - curl -sSfL "$URL" -o "$TARBALL"
                - tar -xzf "$TARBALL" -C "$INSTALL_DIR"
                - chmod +x "$INSTALL_DIR/pwsh"
                - ln -sf "$INSTALL_DIR/pwsh" /usr/bin/pwsh
                - rm -f "$TARBALL"
                - /usr/bin/pwsh --version

  # Managed, versioned SSM Command Document that installs the OS-level shared
  # libraries and fonts Playwright's Chromium needs to run headless on Amazon
  # Linux. `npx playwright install-deps` only supports Debian/Ubuntu (apt), so
  # the equivalent dnf packages are listed here. Browser binaries themselves
  # are installed for the PlaywrightVersion passed by the association, into
  # the shared /opt/playwright-browsers (PLAYWRIGHT_BROWSERS_PATH is exported
  # in /etc/profile.d/playwright.sh), so a project pinned to that version
  # needs no download. Chromium is the supported engine on Amazon Linux;
  # Playwright's WebKit/Firefox builds target Ubuntu. Works on x86_64 and
  # arm64. Amazon Linux specific.
  AmazonLinuxPlaywrightDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{PlaywrightVersion}} is an SSM document
      # parameter and must reach the deployed document literally.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install the system libraries and fonts Playwright's Chromium needs
          to run headless on Amazon Linux (x86_64 and arm64), plus Xvfb for
          headed runs, then the Chromium build for the given Playwright version.
        parameters:
          PlaywrightVersion:
            type: String
            description: Playwright version to install Chromium for (e.g. 1.55.0).
            allowedPattern: ^\d+\.\d+\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installPlaywrightDependencies
            inputs:
              runCommand:
                - set -euxo pipefail
                # Playwright needs Node (installed by the Node config
                # document). That association runs at the same time as this
                # one at first boot, so wait for Node (up to 15 minutes)
                # instead of failing. SSM shells load no profile, so source
                # nvm directly.
                - export HOME=/root
                - |
                  for i in $(seq 1 90); do
                    if [ -s /opt/nvm/nvm.sh ] && ( . /opt/nvm/nvm.sh && command -v node ) >/dev/null 2>&1; then break; fi
                    echo "Waiting for Node.js to be installed ($i/90)..."
                    sleep 10
                  done
                - '. /opt/nvm/nvm.sh && command -v node || { echo "Node.js not found after waiting (check the Node config association)" >&2; exit 1; }'
                # Shared libraries Chromium links against. Installed strictly
                # so a missing package fails the association visibly.
                - >-
                  dnf install -y
                  nss nspr atk at-spi2-atk at-spi2-core cups-libs dbus-libs
                  expat glib2 libdrm libxkbcommon mesa-libgbm alsa-lib
                  pango cairo libX11 libxcb libXcomposite libXcursor
                  libXdamage libXext libXfixes libXi libXrandr libXtst
                  libxshmfence xorg-x11-server-Xvfb
                # Fonts are best-effort (strict=0 skips any package name this
                # AL2023 release does not carry) so text renders in screenshots.
                - >-
                  dnf install -y --setopt=strict=0
                  dejavu-sans-fonts dejavu-serif-fonts dejavu-sans-mono-fonts
                  liberation-fonts google-noto-sans-fonts
                  google-noto-emoji-color-fonts
                - fc-cache -f || true
                # Chromium for the requested Playwright version, shared by
                # every user via PLAYWRIGHT_BROWSERS_PATH.
                - export PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers
                - mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
                - npx --yes "playwright@{{PlaywrightVersion}}" install chromium
                - chmod -R a+rX "$PLAYWRIGHT_BROWSERS_PATH"
                - printf 'export PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers\n' > /etc/profile.d/playwright.sh
                - chmod +x /etc/profile.d/playwright.sh

  # Versioned SSM Command Documents that install a .NET SDK (build, run, test)
  # under /opt/dotnet using Microsoft's dotnet-install.sh, which picks the
  # right x64/arm64 build automatically. ONE DOCUMENT PER MAJOR VERSION (8,
  # 10); the exact SDK version comes from the environment stack's
  # DotNet<major>Version parameter, passed by the association (the documents
  # themselves have no default). A
  # server picks a major with the CloudDevDotNetConfig tag VALUE.
  # Amazon Linux specific (dnf for the native deps).
  AmazonLinuxDotNet8SdkDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{DotNetVersion}} is an SSM document
      # parameter and must reach the deployed document literally. There are
      # intentionally NO ${...} CloudFormation variables in this script.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install the .NET 8 SDK into /opt/dotnet, symlink /usr/bin/dotnet
          and expose DOTNET_ROOT through /etc/profile.d/dotnet.sh. Works on
          x86_64 and arm64 Amazon Linux.
        parameters:
          DotNetVersion:
            type: String
            description: >-
              Exact .NET 8 SDK version to install (e.g. 8.0.426).
            allowedPattern: ^8\.0\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installDotNetSdk
            inputs:
              runCommand:
                - set -euxo pipefail
                # dotnet-install.sh resolves paths from HOME; SSM leaves it unset.
                - export HOME=/root
                - dnf install -y tar gzip libicu krb5-libs openssl-libs zlib libstdc++
                - INSTALL_DIR=/opt/dotnet
                - mkdir -p "$INSTALL_DIR"
                - curl -sSfL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
                - bash /tmp/dotnet-install.sh --version "{{DotNetVersion}}" --install-dir "$INSTALL_DIR" --no-path
                - ln -sf "$INSTALL_DIR/dotnet" /usr/bin/dotnet
                - printf 'export DOTNET_ROOT=/opt/dotnet\nexport DOTNET_CLI_TELEMETRY_OPTOUT=1\nexport PATH="$PATH:$HOME/.dotnet/tools"\n' > /etc/profile.d/dotnet.sh
                - chmod +x /etc/profile.d/dotnet.sh
                - /usr/bin/dotnet --list-sdks

  AmazonLinuxDotNet10SdkDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{DotNetVersion}} is an SSM document
      # parameter and must reach the deployed document literally. There are
      # intentionally NO ${...} CloudFormation variables in this script.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install the .NET 10 SDK into /opt/dotnet, symlink /usr/bin/dotnet
          and expose DOTNET_ROOT through /etc/profile.d/dotnet.sh. Works on
          x86_64 and arm64 Amazon Linux.
        parameters:
          DotNetVersion:
            type: String
            description: >-
              Exact .NET 10 SDK version to install (e.g. 10.0.402).
            allowedPattern: ^10\.0\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installDotNetSdk
            inputs:
              runCommand:
                - set -euxo pipefail
                # dotnet-install.sh resolves paths from HOME; SSM leaves it unset.
                - export HOME=/root
                - dnf install -y tar gzip libicu krb5-libs openssl-libs zlib libstdc++
                - INSTALL_DIR=/opt/dotnet
                - mkdir -p "$INSTALL_DIR"
                - curl -sSfL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
                - bash /tmp/dotnet-install.sh --version "{{DotNetVersion}}" --install-dir "$INSTALL_DIR" --no-path
                - ln -sf "$INSTALL_DIR/dotnet" /usr/bin/dotnet
                - printf 'export DOTNET_ROOT=/opt/dotnet\nexport DOTNET_CLI_TELEMETRY_OPTOUT=1\nexport PATH="$PATH:$HOME/.dotnet/tools"\n' > /etc/profile.d/dotnet.sh
                - chmod +x /etc/profile.d/dotnet.sh
                - /usr/bin/dotnet --list-sdks

  # Managed SSM Command Document that installs small, unversioned CLI
  # utilities from the Amazon Linux repos (jq, zip, unzip). These track the
  # distro's packages, so there is no version parameter; tools whose version
  # matters get their own per-major-version documents below.
  AmazonLinuxBaseToolsDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # No SSM parameters and NO ${...} CloudFormation variables.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install jq, zip and unzip from the Amazon Linux repositories.
        mainSteps:
          - action: aws:runShellScript
            name: installBaseTools
            inputs:
              runCommand:
                - set -euxo pipefail
                - dnf install -y jq zip unzip
                - jq --version

  # Versioned tool documents: ONE DOCUMENT PER TOOL PER MAJOR VERSION. The
  # major version is fixed by the document (and its name); the document's
  # version parameter is an exact version within that major, passed by the
  # association from the environment stack (K6V0Version etc.); nothing floats
  # to "latest". A server picks a major
  # with the tool's tag VALUE (e.g. CloudDevK6Config = v0 | v1), so it can
  # only match one major's association at a time. Add a major by copying a
  # document + association and changing the major number.
  #
  # k6 0.x: installs the k6 binary from Grafana's GitHub release tarball
  # (amd64/arm64 picked from uname) into /usr/local/bin/k6, pinned by K6Version.
  AmazonLinuxK6V0Document:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{K6Version}} is an SSM document parameter
      # and must reach the deployed document literally.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install k6 0.x into /usr/local/bin/k6 from Grafana's GitHub release
          tarball. Works on x86_64 and arm64 Amazon Linux.
        parameters:
          K6Version:
            type: String
            description: >-
              Exact k6 0.x version to install (e.g. 0.59.0).
            allowedPattern: ^0\.\d+\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installK6
            inputs:
              runCommand:
                - set -euxo pipefail
                - K6_VERSION="{{K6Version}}"
                - |
                  case "$(uname -m)" in
                    x86_64)  K6_ARCH="amd64" ;;
                    aarch64) K6_ARCH="arm64" ;;
                    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                  esac
                - dnf install -y tar gzip
                - TMP_DIR=$(mktemp -d)
                - curl -sSfL "https://github.com/grafana/k6/releases/download/v$K6_VERSION/k6-v$K6_VERSION-linux-$K6_ARCH.tar.gz" | tar -xz -C "$TMP_DIR"
                - install -m 0755 "$TMP_DIR/k6-v$K6_VERSION-linux-$K6_ARCH/k6" /usr/local/bin/k6
                - rm -rf "$TMP_DIR"
                - /usr/local/bin/k6 version

  # k6 1.x: same script as the 0.x document, with a 1.x version pattern.
  AmazonLinuxK6V1Document:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{K6Version}} is an SSM document parameter
      # and must reach the deployed document literally.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install k6 1.x into /usr/local/bin/k6 from Grafana's GitHub release
          tarball. Works on x86_64 and arm64 Amazon Linux.
        parameters:
          K6Version:
            type: String
            description: >-
              Exact k6 1.x version to install (e.g. 1.8.2).
            allowedPattern: ^1\.\d+\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installK6
            inputs:
              runCommand:
                - set -euxo pipefail
                - K6_VERSION="{{K6Version}}"
                - |
                  case "$(uname -m)" in
                    x86_64)  K6_ARCH="amd64" ;;
                    aarch64) K6_ARCH="arm64" ;;
                    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                  esac
                - dnf install -y tar gzip
                - TMP_DIR=$(mktemp -d)
                - curl -sSfL "https://github.com/grafana/k6/releases/download/v$K6_VERSION/k6-v$K6_VERSION-linux-$K6_ARCH.tar.gz" | tar -xz -C "$TMP_DIR"
                - install -m 0755 "$TMP_DIR/k6-v$K6_VERSION-linux-$K6_ARCH/k6" /usr/local/bin/k6
                - rm -rf "$TMP_DIR"
                - /usr/local/bin/k6 version

  # AWS CLI 2.x from AWS's official installer into /usr/local/aws-cli, with
  # /usr/local/bin/aws. AL2023 also ships an (older, distro-paced) awscli-2
  # RPM at /usr/bin/aws; it is left in place because UserData uses it to
  # signal CloudFormation, and /usr/local/bin comes first on login shells'
  # PATH. (sudo's secure_path omits /usr/local/bin, so `sudo aws` still runs
  # the RPM build.) --update makes re-runs upgrade or re-pin in place.
  AmazonLinuxAwsCliV2Document:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{AwsCliVersion}} is an SSM document
      # parameter and must reach the deployed document literally.
      Content:
        schemaVersion: "2.2"
        description: >-
          Install AWS CLI v2 with AWS's official installer into
          /usr/local/aws-cli and /usr/local/bin/aws. Works on x86_64 and arm64
          Amazon Linux.
        parameters:
          AwsCliVersion:
            type: String
            description: >-
              Exact AWS CLI 2.x version to install (e.g. 2.38.5).
            allowedPattern: ^2\.\d+\.\d+$
        mainSteps:
          - action: aws:runShellScript
            name: installAwsCli
            inputs:
              runCommand:
                - set -euxo pipefail
                - AWSCLI_VERSION="{{AwsCliVersion}}"
                - |
                  case "$(uname -m)" in
                    x86_64|aarch64) AWSCLI_ARCH="$(uname -m)" ;;
                    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                  esac
                - dnf install -y unzip
                - ZIP_NAME="awscli-exe-linux-$AWSCLI_ARCH-$AWSCLI_VERSION.zip"
                - TMP_DIR=$(mktemp -d)
                - curl -sSfL "https://awscli.amazonaws.com/$ZIP_NAME" -o "$TMP_DIR/awscliv2.zip"
                - unzip -q "$TMP_DIR/awscliv2.zip" -d "$TMP_DIR"
                - '"$TMP_DIR/aws/install" --install-dir /usr/local/aws-cli --bin-dir /usr/local/bin --update'
                - rm -rf "$TMP_DIR"
                - /usr/local/bin/aws --version
                # Start ec2-user with an empty ~/.aws/credentials so it is
                # ready to fill in. Never overwrite an existing file, so
                # re-runs keep any credentials already added. With no profile
                # defined in it, the CLI still uses the instance role.
                - mkdir -p /home/ec2-user/.aws
                - touch /home/ec2-user/.aws/credentials
                - chown -R ec2-user:ec2-user /home/ec2-user/.aws
                - chmod 700 /home/ec2-user/.aws
                - chmod 600 /home/ec2-user/.aws/credentials

  # GitHub document: installs the GitHub CLI 2.x AND rotates the GitHub SSH
  # key, selected by the Action parameter (steps are skipped by precondition).
  #  - Install (default): GitHub CLI from GitHub's release tarball
  #    (amd64/arm64 picked from uname) into /usr/local/bin/gh, pinned by
  #    GhCliVersion. This is what the association runs at launch. git itself
  #    comes from dnf with the Node config document.
  #  - RotateSshKey: on-demand, run it from Run Command or the CLI; the
  #    association never runs it. Generates a new ed25519 key for ec2-user
  #    (the private key never leaves the instance), points the github.com
  #    entry in ~/.ssh/config at it, keeps only the newest KeepKeys keys on
  #    disk and prints the new public key plus the fingerprints of the keys it
  #    removed. Adding the new key to GitHub and deleting the old ones there is
  #    manual: the server holds no GitHub credentials.
  AmazonLinuxGhCliV2Document:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      # Authored WITHOUT Fn::Sub: {{...}} tokens are SSM document parameters
      # and must reach the deployed document literally.
      Content:
        schemaVersion: "2.2"
        description: >-
          GitHub on Amazon Linux dev servers. Action=Install installs the
          GitHub CLI 2.x into /usr/local/bin/gh; Action=RotateSshKey generates
          a new GitHub SSH key for ec2-user and prints the public key to add
          in GitHub.
        parameters:
          Action:
            type: String
            description: Install the GitHub CLI, or rotate the GitHub SSH key.
            default: Install
            allowedValues:
              - Install
              - RotateSshKey
          GhCliVersion:
            type: String
            description: >-
              Exact GitHub CLI 2.x version to install (e.g. 2.103.0). Required
              for Action=Install, ignored for RotateSshKey.
            default: ""
            allowedPattern: ^(2\.\d+\.\d+)?$
          KeepKeys:
            type: String
            description: >-
              RotateSshKey only: how many keys to keep on the instance,
              including the new one (2 = the new key plus the previous one,
              for rollback).
            default: "2"
            allowedPattern: ^[1-9]$
        mainSteps:
          - action: aws:runShellScript
            name: installGhCli
            precondition:
              StringEquals:
                - "{{Action}}"
                - Install
            inputs:
              runCommand:
                - set -euo pipefail
                - GH_VERSION="{{GhCliVersion}}"
                - '[ -n "$GH_VERSION" ] || { echo "GhCliVersion is required for Action=Install" >&2; exit 1; }'
                - |
                  case "$(uname -m)" in
                    x86_64)  GH_ARCH="amd64" ;;
                    aarch64) GH_ARCH="arm64" ;;
                    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                  esac
                - dnf install -y tar gzip
                - TMP_DIR=$(mktemp -d)
                - curl -sSfL "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_${GH_ARCH}.tar.gz" | tar -xz -C "$TMP_DIR"
                - install -m 0755 "$TMP_DIR/gh_${GH_VERSION}_linux_${GH_ARCH}/bin/gh" /usr/local/bin/gh
                - rm -rf "$TMP_DIR"
                - /usr/local/bin/gh --version
          - action: aws:runShellScript
            name: rotateGitHubSshKey
            precondition:
              StringEquals:
                - "{{Action}}"
                - RotateSshKey
            inputs:
              runCommand:
                - set -euo pipefail
                - KEEP="{{KeepKeys}}"
                - USER_NAME=ec2-user
                - SSH_DIR="/home/$USER_NAME/.ssh"
                - KEY_DIR="$SSH_DIR/github"
                - mkdir -p "$KEY_DIR"
                - chmod 700 "$SSH_DIR" "$KEY_DIR"
                - TOKEN=$(curl -sS -X PUT -H "X-aws-ec2-metadata-token-ttl-seconds:60" http://169.254.169.254/latest/api/token)
                - INSTANCE_ID=$(curl -sS -H "X-aws-ec2-metadata-token:$TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
                - STAMP=$(date -u +%Y%m%dT%H%M%SZ)
                - TITLE="$INSTANCE_ID-$STAMP"
                - NEW_KEY="$KEY_DIR/id_ed25519_$STAMP"
                - ssh-keygen -q -t ed25519 -N "" -C "$TITLE" -f "$NEW_KEY"
                # Make the new key the active one. ssh uses the FIRST value it
                # finds for each option, so the managed block goes at the TOP of
                # ~/.ssh/config, ahead of any hand-written "Host github.com".
                # It is replaced on every run; the rest of the file is kept.
                - touch "$SSH_DIR/config"
                - sed -i '/^# BEGIN clouddev-github$/,/^# END clouddev-github$/d' "$SSH_DIR/config"
                - CONFIG_TMP=$(mktemp)
                - |
                  printf '# BEGIN clouddev-github\nHost github.com\n  HostName github.com\n  User git\n  IdentityFile %s\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n# END clouddev-github\n' "$NEW_KEY" > "$CONFIG_TMP"
                - cat "$SSH_DIR/config" >> "$CONFIG_TMP"
                - cat "$CONFIG_TMP" > "$SSH_DIR/config"
                - rm -f "$CONFIG_TMP"
                - chmod 600 "$SSH_DIR/config"
                # Keep only the newest KEEP keys (names sort by timestamp).
                - REMOVED=""
                - |
                  for OLD in $(ls -1 "$KEY_DIR"/id_ed25519_* 2>/dev/null | grep -v '\.pub$' | sort -r | tail -n +$((KEEP + 1))); do
                    REMOVED="$REMOVED$(ssh-keygen -lf "$OLD.pub")"$'\n'
                    rm -f "$OLD" "$OLD.pub"
                  done
                - chown -R "$USER_NAME:$USER_NAME" "$SSH_DIR"
                - echo "=== New GitHub SSH key ==="
                - 'echo "Title: $TITLE"'
                - ssh-keygen -lf "$NEW_KEY.pub"
                - 'echo "Public key (add in GitHub > Settings > SSH keys, or as a deploy key):"'
                - cat "$NEW_KEY.pub"
                - echo "=== Removed from this instance (delete the matching keys in GitHub) ==="
                - 'if [ -n "$REMOVED" ]; then printf "%s" "$REMOVED"; else echo "(none)"; fi'
                - 'echo "After adding the key, verify with: sudo -u ec2-user ssh -T git@github.com"'

  # Automation runbooks that let developers start, stop and restart a dev
  # server from Systems Manager > Automation > Execute. No AssumeRole is set,
  # so they run with the caller's own permissions: the CloudDev permission
  # set only allows EC2 start/stop/reboot on instances tagged with this
  # environment, so these cannot touch anything else.
  StartDevServerRunbook:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Automation
      DocumentFormat: YAML
      # No Fn::Sub: {{InstanceId}} is an Automation parameter and must reach
      # the deployed document literally.
      Content:
        schemaVersion: "0.3"
        description: >-
          Start a stopped CloudDev dev server and wait until it is running.
        parameters:
          InstanceId:
            type: String
            description: Dev server instance to act on.
            allowedPattern: ^i-[0-9a-f]{8,17}$
        mainSteps:
          - name: changeState
            action: aws:changeInstanceState
            inputs:
              InstanceIds:
                - "{{InstanceId}}"
              DesiredState: running

  # Stops a dev server (EBS data is kept; compute billing pauses).
  StopDevServerRunbook:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Automation
      DocumentFormat: YAML
      # No Fn::Sub: {{InstanceId}} is an Automation parameter and must reach
      # the deployed document literally.
      Content:
        schemaVersion: "0.3"
        description: >-
          Stop a running CloudDev dev server and wait until it is stopped.
        parameters:
          InstanceId:
            type: String
            description: Dev server instance to act on.
            allowedPattern: ^i-[0-9a-f]{8,17}$
        mainSteps:
          - name: changeState
            action: aws:changeInstanceState
            inputs:
              InstanceIds:
                - "{{InstanceId}}"
              DesiredState: stopped

  # Reboots a dev server in place (same host, same public IP if any).
  RestartDevServerRunbook:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Automation
      DocumentFormat: YAML
      # No Fn::Sub: {{InstanceId}} is an Automation parameter and must reach
      # the deployed document literally.
      Content:
        schemaVersion: "0.3"
        description: >-
          Reboot a CloudDev dev server in place.
        parameters:
          InstanceId:
            type: String
            description: Dev server instance to act on.
            allowedPattern: ^i-[0-9a-f]{8,17}$
        mainSteps:
          - name: reboot
            action: aws:executeAwsApi
            inputs:
              Service: ec2
              Api: RebootInstances
              InstanceIds:
                - "{{InstanceId}}"


  # Tag-targeted SSM State Manager association that applies the Node config
  # document to every dev server tagged CloudDevNodeConfig=enabled. Lives in
  # this stack beside the document and references it with !Ref (NO
  # Fn::ImportValue), so editing the document no longer hits a cross-stack
  # export lock. No Parameters: the document's own NodeVersion/NpmVersion
  # defaults (fleet-wide, from this stack's params) govern. Launch-only
  # (no ScheduleExpression); applies when a matching instance registers with
  # SSM. Decouple a server by removing its CloudDevNodeConfig tag.
  NodeConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-node-config"
      Name: !Ref AmazonLinuxServerConfigDocument
      Targets:
        - Key: "tag:CloudDevNodeConfig"
          Values:
            - enabled

  # Per-major-version associations for PowerShell and .NET (same pattern as
  # k6 below): each tool has ONE tag key and the tag VALUE selects the
  # document, so a server matches at most one association per tool. Each
  # passes its exact version from the matching environment stack parameter
  # (the documents have no defaults). Launch-only; a server opts out with a
  # value that matches nothing ("none").
  PowerShellV74ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-powershell-v74"
      Name: !Ref AmazonLinuxPowerShellV74Document
      Parameters:
        PowerShellVersion:
          - !Ref PowerShell74Version
      Targets:
        - Key: "tag:CloudDevPowerShellConfig"
          Values:
            - v7.4

  PowerShellV76ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-powershell-v76"
      Name: !Ref AmazonLinuxPowerShellV76Document
      Parameters:
        PowerShellVersion:
          - !Ref PowerShell76Version
      Targets:
        - Key: "tag:CloudDevPowerShellConfig"
          Values:
            - v7.6

  # Tag-targeted association that applies the Playwright document to every
  # dev server tagged CloudDevPlaywrightConfig=enabled, passing the
  # environment stack's PlaywrightVersion (the server stacks use "disabled"
  # when EnablePlaywright=false).
  PlaywrightConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-playwright"
      Name: !Ref AmazonLinuxPlaywrightDocument
      Parameters:
        PlaywrightVersion:
          - !Ref PlaywrightVersion
      Targets:
        - Key: "tag:CloudDevPlaywrightConfig"
          Values:
            - enabled

  DotNet8ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-dotnet8"
      Name: !Ref AmazonLinuxDotNet8SdkDocument
      Parameters:
        DotNetVersion:
          - !Ref DotNet8Version
      Targets:
        - Key: "tag:CloudDevDotNetConfig"
          Values:
            - v8

  DotNet10ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-dotnet10"
      Name: !Ref AmazonLinuxDotNet10SdkDocument
      Parameters:
        DotNetVersion:
          - !Ref DotNet10Version
      Targets:
        - Key: "tag:CloudDevDotNetConfig"
          Values:
            - v10

  # Tag-targeted association that applies the base tools document. Every dev
  # server tags itself CloudDevBaseToolsConfig=enabled, like Node.
  BaseToolsConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-base-tools"
      Name: !Ref AmazonLinuxBaseToolsDocument
      Targets:
        - Key: "tag:CloudDevBaseToolsConfig"
          Values:
            - enabled

  # Per-major-version associations. All k6 majors share one tag key and
  # differ by tag VALUE, so a server matches at most one of them; switching
  # the value and re-applying replaces /usr/local/bin/k6. Each passes its
  # pinned version from the matching environment stack parameter.
  K6V0ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-k6-v0"
      Name: !Ref AmazonLinuxK6V0Document
      Parameters:
        K6Version:
          - !Ref K6V0Version
      Targets:
        - Key: "tag:CloudDevK6Config"
          Values:
            - v0

  K6V1ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-k6-v1"
      Name: !Ref AmazonLinuxK6V1Document
      Parameters:
        K6Version:
          - !Ref K6V1Version
      Targets:
        - Key: "tag:CloudDevK6Config"
          Values:
            - v1

  AwsCliV2ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-awscli-v2"
      Name: !Ref AmazonLinuxAwsCliV2Document
      Parameters:
        AwsCliVersion:
          - !Ref AwsCliV2Version
      Targets:
        - Key: "tag:CloudDevAwsCliConfig"
          Values:
            - v2

  GhCliV2ConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub "${AWS::StackName}-ghcli-v2"
      Name: !Ref AmazonLinuxGhCliV2Document
      Parameters:
        Action:
          - Install
        GhCliVersion:
          - !Ref GhCliV2Version
      Targets:
        - Key: "tag:CloudDevGhCliConfig"
          Values:
            - v2

  # ---- VPC + public networking (created when VpcMode != none) ----
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateVpc
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVpc
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: !Ref "AWS::Region"
      CidrBlock: !Select [0, !Cidr [!GetAtt Vpc.CidrBlock, 8, 12]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: PublicAz2
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: !Ref "AWS::Region"
      CidrBlock: !Select [1, !Cidr [!GetAtt Vpc.CidrBlock, 8, 12]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-2"

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Condition: PublicAz3
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone:
        Fn::Select:
          - 2
          - Fn::GetAZs: !Ref "AWS::Region"
      CidrBlock: !Select [2, !Cidr [!GetAtt Vpc.CidrBlock, 8, 12]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-3"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpc
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: PublicAz2
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: PublicAz3
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

  DevServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateVpc
    Properties:
      GroupDescription: !Sub "SSH access for ${AWS::StackName} dev servers, restricted to a single CIDR."
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCidr
          Description: SSH from the configured allowed CIDR.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic.
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sg"

  # ---- Private networking + NAT (created when VpcMode == public-private) ----
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreatePrivate
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: !Ref "AWS::Region"
      CidrBlock: !Select [3, !Cidr [!GetAtt Vpc.CidrBlock, 8, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: PrivateAz2
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: !Ref "AWS::Region"
      CidrBlock: !Select [4, !Cidr [!GetAtt Vpc.CidrBlock, 8, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-2"

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Condition: PrivateAz3
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone:
        Fn::Select:
          - 2
          - Fn::GetAZs: !Ref "AWS::Region"
      CidrBlock: !Select [5, !Cidr [!GetAtt Vpc.CidrBlock, 8, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-3"

  NatEip:
    Type: AWS::EC2::EIP
    Condition: CreatePrivate
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-eip"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreatePrivate
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreatePrivate
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreatePrivate
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePrivate
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: PrivateAz2
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: PrivateAz3
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  StartDevServerRunbookName:
    Description: Name of the Automation runbook that starts a dev server.
    Value: !Ref StartDevServerRunbook

  StopDevServerRunbookName:
    Description: Name of the Automation runbook that stops a dev server.
    Value: !Ref StopDevServerRunbook

  RestartDevServerRunbookName:
    Description: Name of the Automation runbook that reboots a dev server.
    Value: !Ref RestartDevServerRunbook
  DevServerRoleArn:
    Description: ARN of the shared SSM-managed IAM role.
    Value: !GetAtt DevServerRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DevServerRoleArn"

  DevServerRoleName:
    Description: Name of the shared SSM-managed IAM role.
    Value: !Ref DevServerRole
    Export:
      Name: !Sub "${AWS::StackName}-DevServerRoleName"

  DevServerInstanceProfileArn:
    Description: ARN of the shared instance profile.
    Value: !GetAtt DevServerInstanceProfile.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DevServerInstanceProfileArn"

  DevServerInstanceProfileName:
    Description: Name of the shared instance profile.
    Value: !Ref DevServerInstanceProfile
    Export:
      Name: !Sub "${AWS::StackName}-DevServerInstanceProfileName"

  BootstrapLogGroupName:
    Description: Name of the shared bootstrap CloudWatch log group.
    Value: !Ref BootstrapLogGroup
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapLogGroupName"

  StackNamePrefixOutput:
    Description: >-
      Stack-name prefix the dev server role may signal. Server stacks import
      it to check their own name at boot and log a clear error if it does not
      match.
    Value: !Ref StackNamePrefix
    Export:
      Name: !Sub "${AWS::StackName}-StackNamePrefix"

  BootstrapLogGroupArn:
    Description: ARN of the shared bootstrap CloudWatch log group.
    Value: !GetAtt BootstrapLogGroup.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapLogGroupArn"

  AmazonLinuxServerConfigDocumentName:
    Description: >-
      Name of the shared SSM Command Document that configures Amazon Linux dev
      servers (installs Node.js/npm via nvm). Amazon Linux specific (uses dnf
      and the ec2-user account).
    Value: !Ref AmazonLinuxServerConfigDocument
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxServerConfigDocumentName"

  AmazonLinuxPowerShellV74DocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs PowerShell 7.4.x
      (PowerShellVersion parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxPowerShellV74Document
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxPowerShellV74DocumentName"

  AmazonLinuxPowerShellV76DocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs PowerShell 7.6.x
      (PowerShellVersion parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxPowerShellV76Document
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxPowerShellV76DocumentName"

  AmazonLinuxPlaywrightDocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs Playwright's
      Chromium system dependencies and the Chromium build for the
      PlaywrightVersion parameter on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxPlaywrightDocument
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxPlaywrightDocumentName"

  AmazonLinuxDotNet8SdkDocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs the .NET 8 SDK
      (DotNetVersion parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxDotNet8SdkDocument
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxDotNet8SdkDocumentName"

  AmazonLinuxDotNet10SdkDocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs the .NET 10 SDK
      (DotNetVersion parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxDotNet10SdkDocument
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxDotNet10SdkDocumentName"

  AmazonLinuxBaseToolsDocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs jq, zip and unzip
      on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxBaseToolsDocument
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxBaseToolsDocumentName"

  AmazonLinuxK6V0DocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs k6 0.x
      (K6Version parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxK6V0Document
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxK6V0DocumentName"

  AmazonLinuxK6V1DocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs k6 1.x
      (K6Version parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxK6V1Document
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxK6V1DocumentName"

  AmazonLinuxAwsCliV2DocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs AWS CLI 2.x
      (AwsCliVersion parameter) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxAwsCliV2Document
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxAwsCliV2DocumentName"

  AmazonLinuxGhCliV2DocumentName:
    Description: >-
      Name of the shared SSM Command Document that installs the GitHub CLI 2.x
      (Action=Install, GhCliVersion parameter) and rotates the GitHub SSH key
      (Action=RotateSshKey, run on demand) on Amazon Linux dev servers.
    Value: !Ref AmazonLinuxGhCliV2Document
    Export:
      Name: !Sub "${AWS::StackName}-AmazonLinuxGhCliV2DocumentName"

  VpcId:
    Condition: CreateVpc
    Description: ID of the created VPC.
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  PublicSubnet1Id:
    Condition: CreateVpc
    Description: ID of public subnet 1.
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet1Id"

  PublicSubnet2Id:
    Condition: PublicAz2
    Description: ID of public subnet 2.
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet2Id"

  PublicSubnet3Id:
    Condition: PublicAz3
    Description: ID of public subnet 3.
    Value: !Ref PublicSubnet3
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet3Id"

  PrivateSubnet1Id:
    Condition: CreatePrivate
    Description: ID of private subnet 1.
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet1Id"

  PrivateSubnet2Id:
    Condition: PrivateAz2
    Description: ID of private subnet 2.
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet2Id"

  PrivateSubnet3Id:
    Condition: PrivateAz3
    Description: ID of private subnet 3.
    Value: !Ref PrivateSubnet3
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet3Id"

  DevServerSecurityGroupId:
    Condition: CreateVpc
    Description: ID of the dev-server security group.
    Value: !GetAtt DevServerSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-DevServerSecurityGroupId"
